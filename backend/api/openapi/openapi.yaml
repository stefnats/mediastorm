  /admin/api/live/provider-capacity:
    post:
      operationId: checkLiveProviderCapacity
      summary: Check a saved provider account without opening a stream or saving settings
      description: |
        Requires an administrator account-management cookie. The source must
        already be saved and enabled in global Live TV settings. Only Xtream
        sources and recognized Xtream M3U exports have a supported account
        endpoint. Caller-provided URLs and credentials are rejected.

        Checks use a five-second timeout, a bounded response, no redirects and
        a bounded per-account cache. Success is cached for a minute and failure
        for 30 seconds. Alias configurations share the same check. A zero,
        missing or invalid reported limit remains unknown, never a claim of
        unlimited capacity. Provider connection counts are snapshots and cannot
        reliably identify external usage. Use reported limit copies a manual
        value to the settings form and requires saving. When the global
        autoAdoptProviderLimits opt-in is saved, already checked fresh reports
        may additionally cap new connections without raising a manual cap.
        Reports are never refreshed automatically; stale, unavailable or
        changed-source reports use the existing manual policy. Running inputs
        are not stopped by adoption.
      security:
        - accountSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceId]
              properties:
                sourceId:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Sanitized account facts or an explicit unknown/unavailable/unsupported state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCapacityReport'
        default:
          description: Invalid request, insufficient management authority, changed settings or busy checks.
          content:
            text/plain:
              schema:
                type: string

  /account/api/profiles/live-permissions:
    put:
      operationId: setProfileLivePermissions
      summary: Set independent IPTV rights for an owned adult profile
      security:
        - accountSession: []
      parameters:
        - $ref: '#/components/parameters/StreamProfileID'
        - name: X-Account-Password
          in: header
          description: Fresh account-password proof required for non-master management.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileLivePermissions'
      responses:
        '200':
          description: Independently saved rights; children cannot be granted either right.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLivePermissions'
        default:
          description: Invalid request, insufficient management authority, or a foreign profile.

  /api/live/recordings/{recordingID}/export:
    get:
      tags: [live]
      operationId: exportRecordingParts
      summary: Download closed recording parts without merging them
      description: |
        Streams a ZIP Store archive containing every closed part of a terminal
        completed, failed or cancelled capture-v1 recording and manifest.json.
        Requires the current full account session, stored recording owner and
        current profile PIN access. Scoped sharing and restored/unproven ledgers
        are unsupported. A profile selector, when supplied, must match the owner.
        This does not concatenate media, fill gaps or declare incomplete capture
        complete. No providers, probes or media processes are invoked. Two
        transfers may run concurrently; additional requests are rejected.
        Byte ranges and resume are unsupported. A failed or revoked transfer is
        aborted without finalizing the ZIP; clients must reject partial archives.
        The manifest contains observed capture times and fixed gap reasons, not
        a continuous playback timeline or provider/file system identifiers.
      parameters:
        - name: recordingID
          in: path
          required: true
          schema: {type: string}
        - name: profileId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Complete archive of the closed original attempt files.
          content:
            application/zip:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Capture is active, has unclosed or invalid parts, is restored or unavailable.
        '416':
          description: Byte ranges are unsupported.
        '429':
          description: Both export slots are occupied; retry explicitly later.
        '503':
          description: Export service is unavailable.

  /api/live/recordings/{recordingID}/progress:
    parameters:
      - name: recordingID
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      tags: [live]
      operationId: getRecordingProgress
      parameters:
        - name: includeHistory
          in: query
          required: false
          description: Explicit presentation-only historical DATA opt-in. A single canonical true or false literal is accepted. Omitted or false preserves the exact legacy response fields.
          schema: {type: string, enum: ['true', 'false'], default: 'false'}
      summary: Read the current joined-medium timeline and durable position
      description: |
        Requires the actual original full PG session, stored adult recording
        owner and current configured DVR PIN policy. No profile or token query
        selector, body, Range or condition header is accepted. Reads the actual
        current GetDerived artifact without preparing or renewing it. Timeline,
        counters, position and validUntil are DATA, never media permission.
        Only includeHistory=true returns historical candidate fields; omitted
        or false uses the legacy snapshot shape. Candidates require current
        authority and actual read-transaction cleanup. Missing input/tool/recipe evidence or
        changed ledger/measured coordinates is unverifiable, even if output
        digests match. GET never prepares a fresh artifact.
      responses:
        '200':
          description: Snapshot after actual original transaction cleanup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordingProgressReadEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      tags: [live]
      operationId: updateRecordingProgress
      summary: Claim or update one exact joined-medium position using explicit CAS
      description: |
        One bounded original operation, no retry or counter adoption. Both CAS
        counters are mandatory canonical int64 decimal strings. The complete
        current recording incarnation/artifact/map/duration tuple must match.
        A known COMMIT can persist even if its response is later lost. An
        unavailable response never proves rollback. No query selector is valid.
        Ordinary resume requires the exact current saved mapping. The explicit
        resume-history action uses positionMs zero and current identity/CAS;
        the server re-reads historical DATA under its original transaction and
        requires equal actual input, ledger, tool, recipe and measured timeline
        semantics. Old counters and output-byte equality are not authority.
        Unverifiable historical rebind requires an explicit from-start choice. Historical
        DATA never renews an old artifact TTL or authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordingProgressCommand'}
      responses:
        '200':
          description: Known acknowledged durable result within its original deadline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordingProgressWriteEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

  /api/live/recordings/{recordingID}/derived/join:
    post:
      tags: [live]
      operationId: prepareJoinedRecording
      summary: Prepare a separate checked medium from compatible closed parts
      description: |
        Explicit synchronous empty-body operation under the original current
        full adult account/session, stored owner and profile PIN. One bounded
        job is admitted with no queue. The complete contiguous closed part set
        is copied privately and freshly inspected before stream-copy to a new
        Matroska artifact; originals and recording capture metadata are retained.
        Unknown or incompatible streams/timing, active/restored captures, source
        changes and authorization loss reject the operation. Cancellation waits
        for media processes before releasing the slot. No IPTV/provider request
        is made. Known capture gaps are omitted only with explicit incomplete
        source/gapsOmitted metadata. This does not recover lost content or prove
        glitch-free device playback. GET never starts or refreshes preparation.
      parameters:
        - {name: recordingID, in: path, required: true, schema: {type: string}}
        - {name: profileId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Current validated derived artifact descriptor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DerivedRecording'}
        '400': {description: Nonempty body or invalid request.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Source set is unavailable, changed, unknown or incompatible.'}
        '413': {description: The bounded operation cannot admit the complete source set.}
        '416': {description: Range is unsupported for preparation.}
        '429': {description: A preparation is already active. Retry explicitly later.}
        '503': {description: Preparation is unconfigured or unavailable.}

  /api/live/recordings/{recordingID}/derived:
    get:
      tags: [live]
      operationId: getJoinedRecording
      summary: Read current joined-medium status without media processing
      parameters:
        - {name: recordingID, in: path, required: true, schema: {type: string}}
        - {name: profileId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Current ready descriptor or honest unknown state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DerivedRecording'}
        '400': {description: Nonempty body or invalid request.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: Source or current authority changed.}
        '416': {description: Range is unsupported for status reads.}
        '429': {description: Both current status reader slots are busy.}
        '503': {description: Derived-media service is unavailable.}

  /api/live/recordings/{recordingID}/derived/{derivedID}/stream:
    parameters:
      - {name: recordingID, in: path, required: true, schema: {type: string}}
      - {name: derivedID, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
      - {name: profileId, in: query, schema: {type: string}}
    get:
      tags: [live]
      operationId: streamJoinedRecording
      summary: Read an exact registered joined medium with current owner and PIN
      description: |
        The opaque ID is correlation, never authorization. The whole original
        ledger/source versions and immutable output are checked for every read.
        A fresh authenticated frame is required on each request. Supports one
        canonical bytes range; multiple ranges are rejected. Late authority or
        source loss aborts transfer rather than appending an error to media.
        No raw filesystem URL or first-original-part fallback is exposed.
      parameters:
        - {name: Range, in: header, schema: {type: string}}
      responses:
        '200':
          description: Complete derived media bytes.
          content:
            video/x-matroska:
              schema: {type: string, format: binary}
        '206': {description: One authenticated byte range.}
        '400': {description: Invalid body or repeated Range header.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Registration, source set or output is unavailable or changed.'}
        '413': {description: Bounded source or output size is unavailable.}
        '429': {description: Both checked media reader slots are in use.}
        '416': {description: Unsatisfiable or unsupported range.}
        '503': {description: Derived-media service is unavailable.}
    head:
      tags: [live]
      operationId: inspectJoinedRecordingStream
      summary: Read authenticated derived-media headers without body bytes
      responses:
        '200': {description: Current full representation headers.}
        '206': {description: Current single-range headers.}
        '400': {description: Invalid body or repeated Range header.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: Derived artifact is unavailable or changed.}
        '413': {description: Bounded source or output size is unavailable.}
        '429': {description: Both checked media reader slots are in use.}
        '416': {description: Unsatisfiable or unsupported range.}
        '503': {description: Derived-media service is unavailable.}

  /api/live/recordings/{recordingID}/parts/{partIndex}/timing:
    get:
      tags: [live]
      operationId: getRecordingPartTiming
      summary: Read a previously observed container duration estimate
      description: |
        Passive repository and memory-only lookup for one closed part of a
        terminal completed, failed or cancelled capture-v1 recording. Requires
        the same current full-session, stored owner and PIN authority as parts
        export. Restored or unproven ledgers are unavailable. No media stat/open,
        process, provider or timestamp refresh occurs. Missing, expired or
        changed-ledger observations return unknown, never an inferred duration.
        Observations are process-local, bounded to 128 entries and 15 minutes.
        A cached file binding describes only the file observed at observedAt;
        GET does not check that file again. Neither duration nor binding is an
        exact media duration, timeline, joined sum, file capability or age grant.
      parameters: &recordingPartTimingParameters
        - name: recordingID
          in: path
          required: true
          schema: {type: string}
        - name: partIndex
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 256}
        - name: profileId
          in: query
          schema: {type: string}
      responses: &recordingPartTimingResponses
        '200':
          description: A previous container estimate or explicit unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPartTiming'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Active, restored, unclosed, invalid or changed recording/part.
        '416':
          description: Byte ranges are unsupported.
        '429':
          description: Both process slots or this part's inspection are occupied.
        '503':
          description: Timing service is unavailable.

  /api/live/recordings/{recordingID}/parts/{partIndex}/timing/refresh:
    post:
      tags: [live]
      operationId: refreshRecordingPartTiming
      summary: Explicitly inspect one closed recording part
      description: |
        An empty-body explicit operation; no automatic list, finish, playback or
        export probing occurs. Opens only this part under the recording root and
        passes the already opened regular FD to FFprobe. MPEGTS demuxing and the
        fd protocol are forced; caller paths and URLs are never process inputs.
        Two inspections may run concurrently without a work queue. Each is bound
        to ten seconds or the earlier original request/session/account expiry.
        Authority, ledger, FD identity, size and mtime are rechecked during work
        and before publication; cancellation retains FD and slot until Wait/join.
        Unsupported, inconsistent or non-finite inventory returns unknown.
        A positive duration is always container_estimate, not exact media/PTS
        duration, continuity, a combined timeline, remux or authorization proof.
        FD and metadata checks do not prove immutable contents against in-place
        modification with restored metadata. No provider is contacted.
      parameters: *recordingPartTimingParameters
      responses: *recordingPartTimingResponses

  /admin/api/profiles:
    post:
      tags: [profiles]
      operationId: createAdminProfileWithAcknowledgedOperation
      summary: Create a profile with an acknowledged recovery locator
      description: |
        Adult requests without either confirmation header and JSON storage keep
        their existing policy. PostgreSQL Kids creation always first returns 403
        parent_authorization_required with parentIntent (pcc_) and creationOperation
        (pcr_), each followed by 64 lowercase hex characters, including when the
        first request already contains a password. No creation is attempted yet.
        Retry the exact original request body/method/path/RawPath/raw query with
        one X-Parent-Intent, one X-Profile-Creation-Operation echo and the existing
        X-Account-Password. The pcr locator is correlation only, never a grant.
        Half, duplicate, empty, changed or replayed pairs fail 409 without a new
        capture or adult fallback. The original fresh password/30 second authority,
        shared registry and Cookie ownership policy remain mandatory.
        Strict new User, simpleMode defaults and qualified result commit together.
        A lost or canceled response must never cause automatic creation or defaults
        retry. Retain the acknowledged locator and explicitly read its result.
        Actual Accounts/Onboarding consumers are a separate change.
      security:
        - accountSession: []
      parameters:
        - name: X-Parent-Intent
          in: header
          schema: {type: string}
        - name: X-Profile-Creation-Operation
          in: header
          schema: {type: string, pattern: '^pcr_[0-9a-f]{64}$'}
        - name: X-Account-Password
          in: header
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                color: {type: string}
                accountId: {type: string}
                isKidsProfile: {type: boolean}
      responses:
        '200':
          description: Saved safe management profile and original creationOperation for qualified PG creation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCreationSavedProfile'}
        '403':
          description: First acknowledged challenge, rejected parent password, or existing plain-text management denial
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCreationChallenge'}
            text/plain:
              schema: {type: string}
        '409':
          description: Confirmation changed, expired, incomplete or already consumed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Storage unavailable or outcome unknown; explicitly read the locator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /admin/api/profiles/creation-operations/{operationRef}/read:
    post:
      tags: [profiles]
      operationId: readAdminProfileCreationResult
      summary: Read a qualified creation result using current management authority
      description: |
        Bodyless Cookie management read. Reject query, body, password and both
        write confirmation headers. The locator supplies no execution authority.
        Require a fresh full session/client/current actor role, recorded owner
        management permission and present target current ownership/PIN policy.
        Expiry of the old write session or five minute execution read window does
        not renew write authority or erase already qualified created evidence.
        pending is not absence. not_created means this operation did not create,
        never permission to retry. Missing/pruned/legacy/unauthorized share 404
        unqualified_or_missing. Errors/timeouts do not become not_created.
        created returns only a current same-birth safe profile; deletion/reuse
        invalidates the enrolled birth. changed_or_replaced installs no replacement.
        Matching clean operation-owned cache markers can be adopted together;
        foreign/dirty/successor/unscoped markers and unrelated write stops persist.
        A response never acknowledges all caches. Compact attempted/created/tombstone
        history is durable without a bounded total disk claim; never-attempted
        preparations remain finitely retained with their execution records even
        after a not_created read. There is no automatic retry or follow-up write.
      security:
        - accountSession: []
      parameters:
        - name: operationRef
          in: path
          required: true
          schema: {type: string, pattern: '^pcr_[0-9a-f]{64}$'}
      responses:
        '200':
          description: Qualified outcome with optional current safe profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCreationReadResult'}
        '400':
          description: Body, query or write credentials were supplied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Existing Cookie Origin denial; no operation evidence is disclosed.
          content:
            text/plain:
              schema: {type: string}
        '404':
          description: Uniform unqualified, missing or unauthorized locator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCreationReadResult'}
        '409':
          description: Current authority or local cache selection changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Storage failure or uncertainty remains; never false absence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
