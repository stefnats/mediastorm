  /api/users/{userId}/display-list:
    get:
      tags: [lists]
      operationId: getDisplayList
      summary: Server-sorted, filtered and paged list for shelves and list screens
      description: |
        The server sorts and filters before paging; never re-sort pages on the
        client. Use `total` for paging and `genres` for filter facets.
        `items` is `WatchlistItem[]` for `watchlist` / `custom-list`,
        `TrendingItem[]` for `permanent-prequeue`, `recently-watched-cached`,
        `popular-on-server-cached` and custom-list shelves,
        `HiddenItem[]` for the complete stored `hidden` management index,
        `LovedStoredItem[]` for the complete `loved-stored` browse view,
        plain `Title[]` for `collection-cached`, `similar-cached` and `tmdb-public-list-cached` / `tmdb-person-credits-cached`,
        whitelisted `CachedContinueWatchingItem[]` for `continue-watching-cached`, and
        the delegated metadata payload (usually `TrendingItem[]`) for
        discovery sources.
      parameters:
        - name: audioLanguage
          in: query
          description: Stored audio-track language on an accessible library version. Supported for saved personal lists, permanent prequeue, hidden management, loved-stored, and complete cached catalogue views (collection, similar, recent activity, popularity, public TMDB lists, person credits and continue watching). No browse-time probes or provider lookups. All media features must occur on the same file, with audio language and codec on the same track. A series card matches at least one stored episode/version, not all episodes; continue watching requires the exact official next episode, with missing or alternative numbering left unknown. Noncached discovery remains unsupported.
          schema: {type: string}
        - name: subtitleLanguage
          in: query
          schema: {type: string}
        - name: audioCodec
          in: query
          schema: {type: string}
        - name: videoCodec
          in: query
          schema: {type: string}
        - name: hdr
          in: query
          schema: {type: string, enum: [hdr10, dolby_vision, hlg, sdr]}
        - name: minHeight
          in: query
          schema: {type: integer, minimum: 144, maximum: 8640}
        - name: subtitles
          in: query
          schema: {type: string, enum: [present, absent]}
        - name: mediaUnknown
          in: query
          description: Missing stored version facts remain unknown; known contradictions remain excluded. Uses the same rules as library media filters. These catalogue facts are not a new playback permission or a live file probe.
          schema: {type: string, enum: [include, exclude, only], default: include}
        - name: originalLanguages
          in: query
          description: |
            Up to 32 distinct registered canonical ISO639-3 codes, separated by
            commas. Supported only for stored watchlist, custom-list (including
            aliases and custom-list shelves), permanent-prequeue, hidden, loved-stored
            and collection-cached / continue-watching-cached / recently-watched-cached /
            popular-on-server-cached / similar-cached / tmdb-public-list-cached / tmdb-person-credits-cached. Matches
            current cached provider original-language facts before paging;
            missing, expired or unbound facts are unknown. No provider lookup
            is started. Invalid or unsupported active queries return 400.
          schema:
            type: string
            maxLength: 128
        - name: includeUnknownOriginalLanguage
          in: query
          description: Include unknown original language in addition to selected codes; alone selects only unknown items. False with no codes leaves the list unfiltered.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/UserID'
        - name: source
          in: query
          description: |
            List source. Defaults to `watchlist`. Also: `custom-list` (needs
            `listId`), `hidden`, `continue-watching`, `permanent-prequeue`, `top-ten`,
            `popular-on-server`, `recently-watched`, `trending`, `genre`,
            `decade`, `mdblist`, `stremio`, `tmdb-list`, `trakt-list`,
            `publicmetadb-list`, `simkl-list`, `letterboxd-list`,
            `personalized`, `loved`, `loved-stored`, `custom-ai`, `tmdb-public-list-cached`, `tmdb-person-credits-cached`, `similar`, `similar-cached`, `collection`, `collection-cached`, `continue-watching-cached`, `recently-watched-cached`, `popular-on-server-cached`.
            `tmdb-person-credits-cached` reads unique title membership from one
            saved finite cast array of the existing global-key person-credits
            operation. Requires canonical positive numeric personId; director,
            crew, job, department and discover selectors are not accepted.
            Only a successful normal combined_credits decode in the person mode
            records this source, before later local media/filter/sort/page work.
            Later high-level filter/enrichment errors can follow a valid saved
            observation. Director mode, crew and legacy assembled v5 pages never
            establish it. Missing/null cast is unavailable; explicit [] is valid.
            Every raw row is validated before first-occurrence deduplication by
            explicit media kind plus primary TMDB number. The first exact primary
            label wins, including blank/space labels; later duplicates never
            repair it. Movie42 and series42 remain distinct. The observation is
            bounded at4096 raw cast rows and4MiB serialized stored projection,
            with fixed expiry at most24h or the shorter positive base cache TTL.
            This is not a complete upstream filmography or role/episode count.
            Responses contain plain Title[] and personCredits with fixed
            sourceType person-credits and scope returned-cast-titles, personId,
            metadataLanguage, observedAt and expiresAt. Primary identities and
            labels grant no side-ID, artwork, audio/file, age or playback claim.
            Current full adult session, owned profile/PIN/master policy,
            original service identity and pure effective locale preferences are
            required. Scoped/share sessions and child profiles are rejected.
            Hidden, selected cached original-language membership, whole saved
            observation and expiry are rechecked before publication, without
            claiming an atomic global transaction or immutable future pages.
            Original-language/Unknown OR, title, kind and alphabet filtering
            precede exact deduplicated total and page selection over the whole
            bounded set, including beyond the ordinary local500-title window.
            Only default/name sorting is supported; alphabet facets omit the
            selected-letter restriction. limit=0 returns the finite filtered pool.
            Unsupported, duplicate and noncanonical selectors return400 before
            readers. Only filterMediaType selects movie/series/all on this source.
            Missing/expired/malformed/changed observations return409 with code
            tmdb_person_credits_snapshot_unavailable; unavailable reader or
            preference inputs return503. Reads never generate, fetch, enrich,
            save settings, renew snapshots or fall back to normal source work.
            Existing original-language lookup can remove expired fact files;
            the new strict cast snapshot reader changes no files.
            `tmdb-public-list-cached` explicitly reads one bounded saved item
            array from the existing normal global-key TMDB public-list operation.
            Requires canonical positive numeric listId. Only that successful
            normal provider operation can record a new versioned observation;
            legacy assembled v5 pages and other list sources are never promoted.
            "Public list" names that existing provider mode; the observation
            does not independently verify a provider public/private visibility
            flag or authorize private, account-token or user-list operations.
            The exact decoded item array is observed before local media, filter,
            sorting and paging windows, including the ordinary 500-item limit.
            This is not a promise about omitted upstream pages or full catalogue
            enumeration. Only primary typed TMDB identity, exact stored label
            and original order are retained; no side-ID or language repair.
            Whole observations are limited to 4096 candidates and 4 MiB, with
            fixed expiry at most 24 hours or the shorter positive base TTL.
            Valid explicit empty arrays are supported; missing/null arrays are not.
            Responses contain plain Title[] and publicList with scope
            returned-items, listId, metadataLanguage, observedAt and expiresAt.
            Current full-session adult ownership/PIN and effective source locale
            are required; share/scoped sessions and child profiles are denied.
            Current Hidden, selected cached original-language membership, original
            service/profile/preferences, whole observation and expiry are checked
            again before publication. These independent checks do not freeze
            global state or guarantee immutable pages across requests.
            Original-language/Unknown OR, title, media-kind and alphabet filters
            precede total and paging of the entire bounded observation; name or
            default order is supported. Alphabet facets omit the letter filter.
            limit=0 returns the matching finite pool. Unsupported source, watched,
            discover, genre, rating, year/runtime/unreleased/count/facet selectors,
            duplicate fields and noncanonical identifiers/paging return 400 before
            readers. Only filterMediaType selects media kind on this source;
            the ordinary mediaType/seed selectors are not accepted.
            Missing/expired/malformed/changed observations return 409 with code
            tmdb_public_list_snapshot_unavailable; unavailable readers/preferences
            return 503. Reads do not save settings, refresh, enrich, invoke a
            provider, renew observations or fall back to the ordinary list path.
            This observation grants no playback, audio/file-language or age access.
            `similar-cached` is an explicit full-session adult-profile browse of
            one previously returned normal Similar result set, identified by
            positive canonical tmdbId and seed mediaType movie or series. It is
            not the complete upstream catalogue or omitted provider pages.
            Only successful, non-cached normal generation can record the
            separately versioned observation; legacy bare v4 cache hits do not
            establish it. Candidates retain primary TMDB identities and order,
            without side-ID repair, language, artwork, availability or age claims.
            Expiry is fixed at observation time, at most 24 hours or the shorter
            existing base cache TTL. A valid observed empty result is supported.
            Missing, expired, malformed or changed observations return 409 with
            code similar_snapshot_unavailable; missing readers or unreadable
            preference inputs return 503. Browsing never generates, refreshes,
            renews facts, saves settings or falls back to the ordinary source.
            Current owner, PIN, profile, effective metadata language, Hidden,
            snapshot and selected cached-language membership are rechecked
            before publishing. Scoped/share sessions and child profiles are
            rejected. These independent observations do not freeze global state.
            Original-language/Unknown, title, media-kind and alphabet selection
            precede exact total and paging of the finite observed set. Supports
            default/name sorting; alphabet choices omit the selected-letter
            restriction. limit=0 returns the complete matching observed set.
            Unsupported watched, genre, rating, runtime, year/added sort,
            unreleased, count and facet requirements return 400 before readers.
            The similar descriptor has scope returned-results and retains its
            original seed, metadata language and observation/expiry times.
            This grants no seed/candidate playback, file, audio or age permission.
            The ordinary Similar producer and its provider behavior are unchanged.
            `popular-on-server-cached` is an explicit full-session adult-profile
            browse of complete stored played history shared by opted-in server
            profiles. Each completed stored movie or episode row counts once;
            episodes roll up to their exact primary series identity. Repeated
            plays of the same stored row are not separate observations. Contributor names,
            user IDs and anonymous contributor group identifiers are not exposed.
            minimumViews is a completed-item view threshold, not a distinct-profile
            count; minimumProfiles is its compatibility alias and must agree when
            both are supplied. Canonical groups use only the exact primary
            provider, kind and value, never imported unbound side IDs.
            Current Hidden records, optional viewer hideWatched, cached original
            language, title, media type and alphabet selection precede the actual
            total and paging. Alphabet choices cover the eligible pool without
            the selected-letter restriction. Default ordering is view count,
            then latest qualifying watch, name and identity; name sorting is also
            supported. TrendingItem.rank is the completed-item view count, as on
            the legacy popularity shelf, rather than a page position. limit=0
            returns the entire finite matching title pool with no discovery cap.
            Scoped/share sessions, children, unavailable readers and unsupported
            metadata-dependent requests are rejected using the stored-view rules.
            Changed history, consent, viewer, Hidden or language observations
            return 409 with code popular_titles_snapshot_unavailable; required
            readers unavailable returns 503. Current authority and input revisions
            are checked again before publishing. No provider lookup, enrichment,
            settings/history/user write, identity repair, rating observation or
            fact renewal occurs; existing metadata-cache housekeeping applies.
            This grants no playback, file, audio-language or age proof. The normal
            popular-on-server producer and its existing semantics stay separate.
            `recently-watched-cached` is an explicit full-session adult-profile
            browse of stored played history shared by opted-in server profiles.
            It preserves current owned-profile and PIN checks; scoped/share
            sessions and child profiles cannot use it. Anonymous contributors
            remain anonymous. The complete activity-window history is filtered
            by current Hidden records, optional hideWatched, exact cached
            original language, title, media type and alphabet before the
            per-contributor cap, total and paging. Default order is newest
            qualifying activity; default/name sorting is supported. limit=0
            returns the complete matching capped view without the discovery
            500-item limit. Unsupported genre, rating, runtime, year/added sort,
            unreleased, watch-status, count and facet requirements return 400
            before history or language reads. A changed history, privacy,
            suppression or language observation returns 409 with code
            recent_watches_snapshot_unavailable; unavailable required readers
            return 503. Current authorization is checked again before publishing.
            It creates or renews no provider facts and changes no saved user,
            history or settings data; existing metadata-cache expiry housekeeping
            still applies. No provider lookup, enrichment, identity repair,
            playback, source or prequeue work is started. This view grants no
            playback, file, audio-language or age proof and retains no pool token.
            Legacy recently-watched behavior remains unchanged.
            `continue-watching-cached` is an explicit adult-profile cache browse.
            Only the normal Continue Watching producer can capture its complete
            service feed before the legacy display cap. Pools are independent
            whitelist projections with at most 4096 rows / 4 MiB and 32 profile
            pools. Original expiry is at most 10 minutes, or 30 seconds for an
            estimated episode airtime. Cache reads never renew or rebuild it.
            Missing, expired, invalid, evicted or revision-lost pools return 409
            code continue_watching_snapshot_unavailable; a missing reader is 503.
            Current Hidden and Set Aside records and verified cached original
            language selection precede total and paging. Supports titleFilter,
            filterMediaType, alphabet and default/name/year sorting; limit=0
            returns the complete matching observed pool without the discovery cap.
            Watched, genre, runtime, rating, count, facets and added-sort requests
            return 400. No cold builder, metadata, identity repair, recording
            repository, Plex, artwork, prequeue or delivery-receipt work occurs.
            Whitelist rows retain canonical episode/history/resume coordinates,
            omit private URL/path/maps, and are not playback or history grants.
            Pool correlation does not freeze language or suppression facts.
            Existing normal Continue Watching/next-episode and Recently Watched
            privacy windows are unchanged. A normal explicit Continue Watching
            read remains its existing producer; no automatic fallback is allowed.
            `collection-cached` is an explicit adult-only cache browse, separate
            from the normal collection GET. Requires collectionId (or matching id).
            Only a complete normal TMDB collection response with its actual ID,
            explicit parts array, unique valid IDs and at most 4096 members / 4 MiB
            can populate the language-specific snapshot. It expires within 24 hours
            or the shorter existing cache TTL. Browsing never refreshes it;
            missing, expired, malformed or unavailable snapshots return 409 with
            code collection_snapshot_unavailable, never an empty success or
            automatic provider request. An actual observed empty array is valid.
            Existing GET /api/metadata/collection is the explicit normal reload.
            Supports original language, titleFilter, filterMediaType, alphabet,
            default/year chronological ordering (undated last) and name sorting.
            Hidden and verified cache language selection precede total/page;
            limit=0 returns the entire matching pool with no 500-item discovery cap.
            Unsupported genre/watched/runtime/rating/count/facet/added requirements
            return 400 before reading the snapshot. Only already captured primary
            release dates feed existing unreleased visibility; no release-window
            warmup, History, artwork fetch, enrichment, source or prequeue work.
            The collection response identifies original observation and expiry.
            No global catalogue completeness, immutable pages, file/audio/age
            proof or playback permission is granted. Existing collection route,
            kids enrichment and legacy semantics remain separate.
            `hidden` reads every saved suppression marker for the owned profile,
            without applying suppression to itself or starting metadata/history,
            artwork, source, prequeue or provider work. Its IDs and hiddenAt stay
            unchanged. Supports original language, titleFilter, filterMediaType,
            alphabet and default/added(hiddenAt)/name/year sorting before total
            and pagination. Watched/genre/runtime/rating/count requirements, ratingSource and
            includeFacets=true return
            400. limit=0 yields the complete matching Random pool, not discovery.
            `loved-stored` is a separate complete saved Love-rating browse view.
            It requires the existing owned profile, PIN, client and kids checks.
            Hidden suppression and cached original-language selection run before
            total, alphabet facets and paging, with no discovery 500-item cap.
            Stored IDs, names, kinds, years and rating updatedAt are preserved.
            Items have rank, title (personalRating=love), and updatedAt; rank is
            the one-based position in the effective sorted collection. Default
            order is updatedAt descending, then kind and ID. sortBy=added means
            the saved rating updatedAt, not when the catalogue title was added.
            Only titleFilter, filterMediaType, alphabet and default/added/name/year
            sorting are supported. Active watched/hideWatched, hideUnreleased,
            genre/runtime/rating/count requirements, ratingSource, and general
            includeFacets=true return 400 before reading preferences or language
            facts. No history, artwork, provider, source, reminder or prequeue
            work is started. Missing required readers return 503; missing or
            expired exact cached language facts are unknown. total is the full
            effective count; limit=0 returns the full matching Random pool.
            Only returned titles enter the existing profile/client rating-edit
            receipt store (2000 entries, 30-minute TTL and existing eviction).
            A large Random pool therefore does not promise every row remains
            editable without reloading. No playback, file or age grant follows.
            originalLanguageFilterSupported=true is returned on this source even
            without an active language filter. Responses are private, no-store.
            `loved` reads the active profile's existing Love ratings, with current
            profile/PIN/child restrictions, bounded paging and cache-only artwork;
            it does not create another list or start provider searches.
          schema:
            type: string
            default: watchlist
        - name: listId
          in: query
          description: For tmdb-public-list-cached, a required positive canonical numeric TMDB list identifier; opaque IDs remain valid on their existing sources.
          schema:
            type: string
        - name: collectionId
          in: query
          description: Positive canonical collection ID for collection-cached; conflicting id aliases reject.
          schema: {type: integer, format: int64, minimum: 1}
        - name: tmdbId
          in: query
          description: Required positive canonical seed TMDB ID for similar-cached.
          schema: {type: integer, format: int64, minimum: 1}
        - name: personId
          in: query
          description: Required positive canonical TMDB person identifier for tmdb-person-credits-cached.
          schema: {type: integer, format: int64, minimum: 1}
        - name: mediaType
          in: query
          description: Seed media kind for metadata sources; similar-cached requires movie or series.
          schema: {type: string}
        - name: id
          in: query
          description: Existing collection ID alias; must agree with collectionId when both are supplied.
          schema: {type: integer, format: int64, minimum: 1}
        - name: activityWindowDays
          in: query
          description: |
            Source-specific activity window. Recently-watched sources allow
            1..90 days and default to 14. Popular-on-server sources allow 7..365
            days and default to the configured window, or 90. Cached views use
            the complete stored window before their filters and paging.
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: minimumViews
          in: query
          description: Completed stored media-item view threshold for popular-on-server-cached, not a count of distinct profiles or replay events.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
        - name: minimumProfiles
          in: query
          deprecated: true
          description: Compatibility name for the completed-item view threshold on popularity sources. On popular-on-server-cached it must agree with minimumViews when both are supplied; it never means distinct profiles.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: maxItemsPerProfile
          in: query
          description: Per-contributor cap for recently-watched and recently-watched-cached. Defaults to the configured cap, or 3. For the cached source all supported visibility and language filters precede this cap.
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: hideWatched
          in: query
          description: Hide titles already watched by the current viewer where supported. On the cached shared-history sources this uses stored viewer history before selection and paging; it does not build progress or fetch metadata.
          schema:
            type: boolean
            default: false
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [default, added, name, year, duration, rating]
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: ratingSource
          in: query
          description: Rating source used by `sortBy=rating` (for example `imdb`, `tmdb`).
          schema:
            type: string
        - name: genres
          in: query
          description: Comma-separated genre names; an item matches if it has any of them.
          schema:
            type: string
        - name: watchStatus
          in: query
          description: |
            `none`/`partial`/`complete`, or the aliases `unwatched`,
            `in_progress`, `watched`. `all` disables the filter.
          schema:
            type: string
        - name: titleFilter
          in: query
          description: Case-insensitive substring match on the title.
          schema:
            type: string
        - name: filterMediaType
          in: query
          schema:
            type: string
            enum: [all, movie, series]
        - name: alphabet
          in: query
          description: Restrict to one alphabet bucket from `alphabetBuckets`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: includeFacets
          in: query
          schema:
            type: boolean
        - name: includeUnwatchedCounts
          in: query
          schema:
            type: boolean
        - name: homeView
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      responses:
        '200':
          description: One page of the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Requested stored observation is unavailable or changed; only an explicit ordinary producer request may contact a provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          $ref: '#/components/responses/Error'

  /api/video/hls/{sessionID}/seek:
    post:
      tags: [video]
      operationId: seekHlsSession
      summary: Seek a legacy HLS session or explicitly restart the dormant pipe subset at zero
      description: |
        Nil/uninstalled legacy seek behavior is unchanged. The dormant configured
        normal H264/AAC TS pipe subset accepts only one explicitly claimed
        restart at zero per original session, for at most two input attempts.
        Its time must be the single canonical query string 0. Body, source/path,
        track, target, start and other setup flags are rejected before demand.
        The exact original full session/client, consistent explicit profile,
        current PIN/source ACL and unchanged explicitly inactive applicability
        are required. Unknown or active applicability fails closed. Original
        private authority and its absolute expiry are never reissued or renewed.
        Old process/body/pump must join before a successor GET can open. Each
        attempt uses a fresh single GET and confined prefix/probe/pipe, with
        unique directory and exact runtime/generation replacement. Setup follows
        request cancellation until successful explicit handoff, then survives
        HTTP completion only within the unchanged original authority deadline.
        A failed/canceled reservation cannot be retried. Position greater than
        zero, automatic recovery and Cast/Live/HDR/HW/CC remain unsupported with
        this dormant boundary. No remux/continuous timeline, immutable-file or
        age permission is implied. Main does not install the boundary; this
        documents an existing endpoint, not public family-policy activation.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: {type: string}
        - name: time
          in: query
          required: true
          description: Seconds for legacy seek; exactly one canonical 0 for configured zero restart.
          schema: {type: number, minimum: 0}
        - $ref: '#/components/parameters/StreamProfileID'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      responses:
        '200':
          description: Setup handed off; not a guarantee of future stream availability or a file/age grant.
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, playlistUrl, startOffset, actualStartOffset, keyframeDelta]
                properties:
                  sessionId: {type: string}
                  playlistUrl: {type: string}
                  startOffset: {type: number}
                  actualStartOffset: {type: number}
                  keyframeDelta: {type: number}
                  duration: {type: number}
                  stableCastTimeline: {type: boolean}
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/indexers/search:
    get:
      tags: [sources]
      operationId: searchSources
      summary: Search configured indexers and scrapers for playable sources
      description: |
        Plain searches return `IndexerResult[]`. `includeFiltered=true` adds
        scoring fields (and filtered-out results); adding
        `includeAdaptiveSummary=true` wraps the list in
        `IndexerSearchEnvelope`. With `includeSourceHealth=true` each result
        carries `sourceHealth`; poll `/api/indexers/source-health` with the
        token of `pending` results.
        With sourceFiltersVersion=1 an owned full-session profile receives a
        bounded retained snapshot before presentation caps. Provider fetch budgets
        remain unchanged. Only the normal initial visible health budget is used.
        A target is request correlation, never verified catalogue eligibility.
      parameters:
        - name: sourceFiltersVersion
          in: query
          schema: {type: integer, enum: [1]}
        - name: episodeId
          in: query
          schema: {type: string, maxLength: 1024}
        - name: seasonNumber
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000}
        - name: episodeNumber
          in: query
          schema: {type: integer, minimum: 1, maximum: 100000}
        - name: q
          in: query
          description: Search text (title, plus `SxxEyy` for episodes).
          schema:
            type: string
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: imdbId
          in: query
          schema:
            type: string
        - name: titleId
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum results (default 5).
          schema:
            type: integer
            minimum: 1
        - name: cat
          in: query
          description: Newznab categories; repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: '#/components/parameters/UserIDQuery'
        - name: clientId
          in: query
          description: Fallback when the `X-Client-ID` header cannot be sent.
          schema:
            type: string
        - name: episodeNumberingId
          in: query
          schema:
            type: string
        - name: episodeOrdering
          in: query
          schema:
            type: string
        - name: includeFiltered
          in: query
          schema:
            type: boolean
        - name: includeAdaptiveSummary
          in: query
          description: Only honoured with `includeFiltered=true`.
          schema:
            type: boolean
        - name: includeSourceHealth
          in: query
          schema:
            type: boolean
        - name: downloadRanking
          in: query
          schema:
            type: boolean
        - name: seasonPacks
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - $ref: '#/components/parameters/AdaptiveThroughputMbps'
        - $ref: '#/components/parameters/AdaptiveThroughputMeasuredAt'
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/IndexerResult'
                  - $ref: '#/components/schemas/IndexerSearchEnvelope'
                  - $ref: '#/components/schemas/SourceFilterPage'
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/SearchError'
        '504':
          $ref: '#/components/responses/SearchError'

  /api/users/{userId}/source-searches/{snapshotId}/page:
    post:
      tags: [sources]
      operationId: sourceSearchPage
      summary: Filter or page an existing owned source snapshot without I/O
      description: |
        Cache-only. No provider, metadata, preparation, probe or health call is
        initiated. Rows preserve original result data and immutable sourceIndex.
        total counts displayed matches plus included unknowns across the retained
        pool; matchedTotal and unknownTotal count both categories independently.
        No predicates yields unfiltered rows with both evidence counts zero.
        Views freeze order, counts and proof and expire at the earliest proof
        deadline, including proof that excluded a row. A fresh explicit probe
        invalidates old views. Apply without cursor creates another cache-only
        view. Snapshot/context expiry requires an explicit ordinary reload.
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string}
        - name: snapshotId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceFilterPageRequest'}
      responses:
        '200':
          description: One immutable view page, never a playback or catalogue grant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceFilterPage'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: source_view_expired/source_view_changed permit cache-only Apply; source_snapshot_context_changed requires explicit reload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

  /api/usenet/health:
    post:
      tags: [sources]
      operationId: checkUsenetHealth
      summary: Run the existing explicit Usenet health or requested track check
      description: Optional mediaEvidence reports only work already performed. Caller result attributes never establish a catalogue or episode binding; source-only facts do not establish playback eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExplicitHealthRequest'}
      responses:
        '200':
          description: Existing health result with optional source-only input metadata
