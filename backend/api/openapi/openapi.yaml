openapi: 3.1.0
info:
  title: MediaStorm client API
  version: 1.0.0
  summary: Client-facing routes used by the native TV clients (tvOS, Android TV).
  description: |
    Contract for the backend routes the native TV clients call. Shapes are
    derived from the Go handlers and models in `backend/handlers` and
    `backend/models`; `backend/handlers/openapi_contract_test.go` validates
    representative handler requests and responses against this document.

    Conventions:

    - **Units.** Positions, durations and offsets are seconds unless a field
      name says otherwise (`runtimeMinutes`, `waitMs`, `sizeBytes`).
      Percentages (`percentWatched`, `resumePercent`, `resume.percent`) are
      0–100, never 0–1.
    - **Optional fields.** Newer servers add fields over time and older
      servers omit them. Every field not listed under `required` may be
      absent; clients must check for presence and degrade gracefully. This
      applies in particular to `releaseDate`/`availability`, `resume`,
      `itemId`, `trackSelection`, `sourceHealth` and `upNextEpisode`.
    - **Unknown fields.** Responses are open: clients must ignore fields
      they do not know. Some request bodies are closed (the server rejects
      unknown fields with 400); those schemas set
      `additionalProperties: false`.
    - **Auth.** Every route except login and `GET /api/version` requires a
      session token as `Authorization: Bearer <token>`. Media URLs that
      cannot carry headers (`/api/video/stream`) may instead pass `?token=`.
      Tokens rotate on `POST /api/auth/refresh`; the old token stops working
      immediately.
    - **Profile ownership.** A normal account may select only its own profiles
      in path, query or top-level JSON fields, including on global live/video
      routes and cookie-authenticated account routes. Foreign selectors return
      404 even when PIN enforcement is disabled. Existing HLS resources use
      their stored profile, and stream invitations remain source-bound. Global
      JSON object bodies are inspected up to 1 MiB independently of Content-Type;
      oversized objects return 413. Profile-path bulk imports and diagnostic
      uploads retain their existing limits.
    - **Account-managed Live TV.** Provider account assignments are intersected
      with profile restrictions. Explicit empty account assignments deny access;
      requireAccountAssignment also denies unassigned legacy providers. When
      account rules are active, guide queries must include an owned profile and
      may name only its visible channels. Recording jobs use the authorized
      catalog URL rather than a caller-supplied source URL.
    - **Profile PINs.** `POST /api/users/{userId}/pin/verify` returns an
      `unlockToken` for PIN-protected profiles. Send it on every request that
      names that profile (path `{userId}`, `profileId`/`userId` query
      parameters, or `profileId`/`userId` JSON body fields) as the
      `X-Profile-Unlock` header (comma-separate several tokens), or as the
      `profileUnlock` query parameter on media URLs that cannot carry
      headers. When the server setting `security.enforceProfilePins` is on,
      existing HLS resources also check their stored profile even when the
      client omits or substitutes a selector. Requests for a PIN-protected
      profile without a valid unlock get 403
      with `code: profile_locked` (the session is still valid; prompt for the
      PIN, verify, retry). When the setting is off (the default) the header
      is accepted and ignored. Unlocks survive `POST /api/auth/refresh`, end
      at logout, when the profile's PIN changes or is removed, and at
      `expiresAt`.
    - **Parental changes.** Normal accounts must confirm their current account
      password for changes to kids flags, restrictions and allowlists, profile
      PINs, and profile deletion. Send it as `X-Account-Password` on the mutation.
      Browser account pages prompt when required and send `base64:` followed by
      the Base64-encoded UTF-8 password so Unicode and whitespace are preserved.
      Raw ASCII values are also accepted. The header is not a session
      token and must never be stored, logged or placed in a URL. Missing or wrong
      proof returns 403 with `code: parent_authorization_required`; the normal
      session remains valid. Administrators retain their existing management
      access. Wrong password attempts are rate-limited per account. Creating a
      profile through `POST /api/users` still uses its existing `password` body
      field. A non-kids profile's own PIN needs no password when adding its
      first PIN, or when changing or removing a PIN proven by a valid
      `X-Profile-Unlock` token for that profile.
    - **Client identity.** Send `X-Client-ID` (a stable per-device ID) on
      every request. Device settings, stream limits, adaptive playback and
      track preferences key off it.
    - **Errors.** Most failures return `{"error": "...", "code": "..."}`
      (`Error` schema). Branch on `code`, never on the `error` text (the text
      is kept stable only for older clients). Stable auth-related codes:

      | status | code | meaning |
      |---|---|---|
      | 401 | `unauthorized` | no session token supplied |
      | 401 | `session_expired` | token unknown, revoked, rotated or expired — refresh or sign in |
      | 401 | `account_expired` | the account expired; all sessions were revoked |
      | 401 | `invalid_credentials` | wrong username/password at login |
      | 401 | `password_invalid` | wrong current password on a re-auth check; session still valid |
      | 401 | `pin_invalid` | wrong profile PIN; session still valid |
      | 401 | `pin_required` | PIN verify sent without a PIN; session still valid |
      | 403 | `profile_locked` | PIN-protected profile not unlocked; session still valid |
      | 403 | `forbidden` / `master_required` | the session may not use this route |
      | 404 | `profile_not_found` | profile does not exist or belongs to another account |
      | 428 | `default_password` | master still uses the default password; resubmit login with `newPassword` |
      | 429 | `rate_limited` | too many attempts; honour `Retry-After` (seconds) |

      Only `session_expired`, `unauthorized` and `account_expired` mean the
      session is unusable. Some older handler paths still use Go's
      `http.Error`, which sends the message as `text/plain`; treat any
      non-2xx body as an opaque message when it does not parse.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: profiles
  - name: history
  - name: metadata
  - name: lists
  - name: sources
  - name: playback
  - name: clients

paths:
  /admin/api/usenet/fallback:
    get:
      operationId: listSABFallbackStatuses
      summary: Browse saved SAB handoff observations
      description: |
        Full current master cookie session required, checked against actual account
        and non-renewing session readers before and after the bounded SQL read.
        Same original request/claim/session/account deadline, at most five seconds.
        Reads only durable fallback receipts. Never submits, polls, resolves NZBs,
        calls SAB, imports, or grants playback. Unknown remains a saved observation.
        Descending queue ID keyset; the cursor excludes newer queue entries but
        does not freeze updates, deletions or receipts later attached to older
        queue entries. No total or immutable snapshot claim.
        Browse accepts only the two optional single-valued query keys below and
        no body. Missing/corrupt data and SQL errors are not successful empty pages.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Bounded saved observations; no provider check was started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SABFallbackPage'}
        '400': {description: 'Invalid or duplicate query, cursor, limit or unexpected body.'}
        '403': {description: Current full master session required.}
        '503': {description: 'Saved receipt index, SQL read or current authority unavailable.'}
  /admin/api/usenet/fallback/{queueID}:
    get:
      operationId: getUsenetFallbackStatus
      summary: Read the persisted legacy SAB download handoff observation
      description: |
        Master administration only. Requires a current full cookie session and
        the actual current SQL account role, not a cached IsMaster claim.
        Rechecks the original session/account and unchanged earliest expiry
        before returning. Scoped/delegated sessions and missing fresh readers
        fail closed. No provider request, submit, retry, import or file access.

        This observes only the existing opt-in terminal-import-error SAB fallback.
        It does not enable a new automatic Play/download/Arr/Library workflow.
        A queued download is not a playable stream; download_completed is only
        an external download observation, never imported/stream-ready/file/age
        permission. checkedAt is this server's explicit status-response completion
        time, not a provider measurement or proof that a local file exists.
        submittedAt is the local durable handoff-attempt time, not confirmation
        of provider acceptance.
        Missing acknowledgement is submission_unknown, never an automatic retry.
        Only allowlisted status/timestamps are returned, without job IDs, source
        endpoints, credentials, provider errors, release names or output paths.
      parameters:
        - {$ref: '#/components/parameters/SABFallbackQueueID'}
      responses:
        '200':
          description: Persisted observation only; no new network activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SABFallbackStatus'}
        '400': {description: Noncanonical ID or unexpected query/body.}
        '403': {description: Current full master session required.}
        '404': {description: Queue item not found.}
        '503': {description: Persisted handoff state or fresh authority reader unavailable.}
  /admin/api/usenet/fallback/{queueID}/refresh:
    post:
      operationId: refreshUsenetFallbackStatus
      summary: Explicitly refresh one existing SAB job observation
      description: |
        Empty body, no query. Same-origin cookie route using the existing origin
        protection. The same actual full-session/master checks run before and
        after work with deadline min(original request, original claim, current
        session, account expiry, five seconds). No deadline/session renewal.
        At most two fallback operations run in one importer instance; durable
        per-job CAS prevents concurrent refresh publication. Requests do not queue.

        Calls only the existing job's SAB status operation, at most queue then
        history through the existing SAB-compatible client. Never submits, starts
        a poller, guesses another job, imports or opens a completed path. Current
        opt-in/backend/credential fingerprint must match before and after network
        access. Changed configuration cannot route an old job to a new backend.
        Completed/failed/unknown-acknowledgement receipts need no provider request.
        Network/unknown status is an explicit uncertainty, never a completed import.
      parameters:
        - {$ref: '#/components/parameters/SABFallbackQueueID'}
      responses:
        '200':
          description: Safe observed download status; not a file/playback grant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SABFallbackStatus'}
        '400': {description: Noncanonical ID or unexpected query/body.}
        '403': {description: Current full master/origin authority missing or changed.}
        '404': {description: Queue item not found.}
        '409': {description: Backend or credentials no longer match the original handoff.}
        '429': {description: Fallback operation or job refresh busy.}
        '503': {description: Safe observation unavailable or request budget expired.}
  /admin/api/usenet/fallback/{queueID}/import-preview:
    post:
      operationId: previewSABLocalInventory
      summary: Explicitly inspect mapped local completed-download metadata
      description: |
        Empty body and no query. Uses the existing same-origin cookie wrapper and
        actual current full-session/master reader before repository/network/file
        work and before publication, preserving original account/session expiry
        and at most five seconds. No profile/child/playback authority is created.

        Requires a completed durable SAB receipt with the original backend and
        credential fingerprint, plus explicitly configured private absolute POSIX
        sabnzbd.importPreviewRemoteRoot and sabnzbd.importPreviewLocalRoot. Both
        settings are write-only/redacted and empty by default. No same-host or
        path guessing. Only this explicit POST may recheck that completed SAB job.
        The returned remote path is never disclosed or treated as file authority.

        A held local root/output directory and no-follow regular file descriptors
        support one flat complete inventory: at most 128 total directory entries
        and 1 TiB observed regular-file bytes. Directories, links, special files,
        escaping paths, incomplete inventories and observed identity/size/mtime
        changes fail closed. Only metadata is read, never file payload or codecs.
        At most two operations share existing importer slots; slots/descriptors
        remain held until real OS work and cleanup return. Context checks bound
        next operations, not a claim of interrupting blocked filesystem syscalls.

        The existing durable receipt refresh claim, safe status observation and
        claim cleanup may be updated. No filesystem creation/payload write/copy,
        extraction, scan, provider/metadata/source warm, import, reservation,
        polling, submit, Arr or playback action is performed. Bytes
        are an at-check observation, not available space, immutable file content,
        media duration, catalogue match or a later import/file/age permission.
      parameters:
        - {$ref: '#/components/parameters/SABFallbackQueueID'}
      responses:
        '200':
          description: Complete bounded metadata observation, not import readiness.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SABImportPreview'}
        '400': {description: Noncanonical ID or unexpected query/body.}
        '403': {description: Original master/session/origin authority missing or changed.}
        '404': {description: Durable queue item missing.}
        '409': {description: Original backend or credentials changed.}
        '429': {description: Shared operation or receipt refresh busy.}
        '503': {description: Mapping/completion/complete local inventory unavailable.}
  /admin/api/usenet/fallback/{queueID}/stage:
    get:
      operationId: getSABManagedCopy
      summary: View a saved local copy observation
      description: |
        Actual current full-session master authority is checked before and after
        DB/settings reads, with the original claim/account/session/request expiry
        and at most five seconds. No SAB status query, media Stat/Open, payload
        read, copy, provider/metadata warm, worker, import or playback work occurs.
        A known saved path binding is historical, not a fresh filesystem proof.
        An unobserved configured path returns unknown/namespace_unobserved without
        zero counts: an alias may already share an existing charged namespace.
        Pending and failed attempts require later explicit reconciliation; there
        is no automatic retry, cleanup, charge release or ready-to-play state.
      parameters:
        - {$ref: '#/components/parameters/SABFallbackQueueID'}
      responses:
        '200':
          description: Safe saved observation, not current file or free-space proof.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SABManagedCopy'}
        '400': {description: Noncanonical ID or unexpected query/body.}
        '403': {description: Original full master/session authority missing or changed.}
        '404': {description: Original queue item missing.}
        '503': {description: Settings/SQL/receipt/observation unavailable.}
    post:
      operationId: copySABManagedFiles
      summary: Explicitly copy completed files to configured managed storage
      description: |
        Empty body and no query. Existing same-origin cookie/Sec-Fetch wrapper
        and actual current full-session/master reader bind the original request,
        session, account and config. At most five minutes, without detach or a
        background worker. Current server-only sabnzbd.importStageTargetRoot and
        positive sabnzbd.importStageMaxBytes are required; empty/zero defaults off.
        The root is redacted on settings/HTML readback and preserved on mask save.
        No client path, namespace, quota ID, ordinal or preview result is a grant.

        The completed original SAB receipt/backend/credentials are rechecked.
        Fresh held regular source FDs copy fixed bytes to exclusively created
        opaque destination names with fsync and exact-byte hashes. Source/target
        roots must be physically separate. Root/file identities, original
        authority/config/receipt and fixed sizes are guarded throughout the copy.
        Two shared operations and a 1 MiB buffer per copy remain owned until real
        IO and FD cleanup return. Context gates do not promise syscall interruption.

        Logical quota counts all pending, failed-partial, copied and uncertain
        attempts until a later explicit verified reconciliation. It is not a
        physical reservation or one global quota across separate configured roots.
        Existing attempts never copy again, including after unknown/restart.
        An existing-attempt explicit POST may bind an actually observed alias
        path to its held root namespace without copying or changing any charge.
        It never overwrites an old path binding; unknown commits are not retried.

        An interrupted/error response may follow partial or completed file/SQL
        changes. View saved copy to inspect the recorded outcome. Download/copy
        completion is not a catalogue match, imported/stream-ready/file/age grant.
        No library scan, extraction, source deletion, Arr, polling, automatic
        recovery, cleanup or playback is added.
      parameters:
        - {$ref: '#/components/parameters/SABFallbackQueueID'}
      responses:
        '200':
          description: Safe recorded copy observation, not permission to play.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SABManagedCopy'}
        '400': {description: Noncanonical ID or unexpected query/body.}
        '403': {description: Original full master/session/origin authority missing or changed.}
        '404': {description: Original queue item missing.}
        '409': {description: "Existing attempt, logical budget exceeded or changed source."}
        '429': {description: Shared bounded operation is busy.}
        '503': {description: Disabled/unavailable or uncertain copy outcome; never auto-retry.}
  /api/library/libraries/{libraryID}/groups:
    get:
      operationId: listLibraryGroups
      summary: Browse the stored library index
      description: |
        Existing local and remote library group listing. Only local `include=cards`
        responses advertise `originalLanguageFilterSupported: true`. Negotiate on
        this normal response; no additional probe request is needed. Active
        original-language filters require local cards; remote libraries and
        non-card views return 400 before group/provider demand.

        The complete saved local index is grouped and filtered before alphabet
        buckets, total, limit and offset. Existing library access and profile
        restrictions still apply. Each group's catalogue reference requires one
        consistent MatchedTitleID and matching movie/series kind from ALL saved
        members, including versions omitted by another item filter. Missing or
        inconsistent assignments are Unknown. Metadata IDs, saved side IDs,
        filenames and scalar languages do not supply replacement evidence.

        Languages use only current, provider-bound cached original-language facts.
        Filtered cards keep saved artwork and do not enrich episodes, localize
        images, scan files, probe media or fetch metadata/providers. Missing,
        expired, malformed and wrong-identity facts are Unknown. Cache housekeeping
        may create cache directories or remove expired entries; observation times
        are not refreshed. This concerns the assigned catalogue work, not file
        identity, audio tracks, regional certification or playback permission.
        Remote provider completeness and a cross-request immutable snapshot are
        not claimed. Unfiltered legacy loading/enrichment remains unchanged.
      parameters:
        - name: libraryID
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: profileId
          in: query
          schema: {type: string}
        - name: userId
          in: query
          description: Existing profile selector alias.
          schema: {type: string}
        - name: include
          in: query
          schema: {type: string}
        - name: originalLanguages
          in: query
          description: Up to 32 distinct canonical registered ISO 639-3 codes, comma-separated. No aliases or regional tags. Omit when inactive.
          schema: {type: string, maxLength: 128}
        - name: includeUnknownOriginalLanguage
          in: query
          description: Explicit OR with selected codes; true without codes is Unknown-only. No selection leaves the list unfiltered.
          schema: {type: boolean}
        - name: filter
          in: query
          schema: {type: string}
        - name: query
          in: query
          schema: {type: string}
        - name: mediaType
          in: query
          schema: {type: string}
        - name: alphabet
          in: query
          schema: {type: string}
        - name: sort
          in: query
          schema: {type: string}
        - name: dir
          in: query
          schema: {type: string}
        - name: limit
          in: query
          description: Existing default 50, maximum 200; values outside 1..200 use 50.
          schema: {type: integer}
        - name: offset
          in: query
          schema: {type: integer}
      responses:
        '200':
          description: Page from the effective stored group collection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalLibraryGroups'}
        '400':
          description: Invalid original-language query or active filter on an unsupported library/view.
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: Missing or invalid account session.
        '403':
          description: Profile PIN required or access denied.
        '404':
          description: Library unavailable to the current account/profile.
        '503':
          description: Local media service unavailable.
  /api/users/{userId}/recommendation-interests:
    delete:
      operationId: clearRecommendationInterests
      summary: Clear the profile's locally saved search interests
      description: Clears saved resolved-title signals and invalidates queued observations. Raw queries are not saved. Requires the profile's owning account or master access and any enforced profile unlock.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Search interests cleared
        '401':
          description: Authentication required
        '403':
          description: Profile unlock required
        '404':
          description: Profile not found
        '500':
          description: Storage error
        '503':
          description: Search-interest storage unavailable
  /api/users/{userId}/reminders:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/ProfileUnlock'
    get:
      operationId: listTitleReminders
      summary: List this adult profile's active in-app reminders
      description: Updates use existing observations only, without creating metadata or source demand. Child and scoped sessions are denied.
      responses:
        '200':
          description: Owned reminders and capability marker.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReminderList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '501': {$ref: '#/components/responses/Error'}
    post:
      operationId: createTitleReminder
      summary: Subscribe to a distinct metadata milestone or source candidate
      description: |
        Identifiers must resolve to recently delivered server metadata. Release
        is an announced movie release-date milestone, not proof of playback.
        New episode requires canonical official episode provenance. A matching
        source is a candidate for the creating device's current intent only.
        Existing pre-creation candidates are informational and do not flood the
        inbox. A future checkpoint may be seeded from fresh delivered metadata.
        No external notification channel is created. Title alias idempotency
        returns the stable saved identity and echoes requestedContentId.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReminderCreate'}
      responses:
        '200':
          description: Created or idempotently returned reminder.
          content:
            application/json:
              schema:
                type: object
                required: [remindersSupported, monitoring, requestedContentId, item]
                properties:
                  remindersSupported: {type: boolean, enum: [true]}
                  monitoring: {type: string, enum: [observations_only]}
                  requestedContentId: {type: string}
                  item: {$ref: '#/components/schemas/Reminder'}
                  currentCandidate: {$ref: '#/components/schemas/SourceAvailability'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Metadata must be reloaded or a reminder limit was reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReminderError'}
  /api/users/{userId}/reminders/{reminderId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/ProfileUnlock'
      - name: reminderId
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: revokeTitleReminder
      summary: Revoke future events while retaining existing inbox receipts
      responses:
        '204': {description: Revoked.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
  /api/users/{userId}/reminder-events:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/ProfileUnlock'
    get:
      operationId: listReminderEvents
      summary: Read the owned in-app inbox without external delivery
      parameters:
        - name: unread
          in: query
          schema: {type: boolean, default: false}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Undismissed events in descending stable order.
          content:
            application/json:
              schema:
                type: object
                required: [remindersSupported, monitoring, items]
                properties:
                  remindersSupported: {type: boolean, enum: [true]}
                  monitoring: {type: string, enum: [observations_only]}
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ReminderEvent'}}
                  nextCursor: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/users/{userId}/reminder-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ClientID'
      - $ref: '#/components/parameters/ProfileUnlock'
      - name: eventId
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: markReminderEvent
      summary: Set read or dismissed state without resetting dedup receipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                read: {type: boolean}
                dismissed: {type: boolean}
              anyOf:
                - required: [read]
                - required: [dismissed]
      responses:
        '200':
          description: Saved inbox state.
          content:
            application/json:
              schema:
                type: object
                required: [remindersSupported, item]
                properties:
                  remindersSupported: {type: boolean, enum: [true]}
                  item: {$ref: '#/components/schemas/ReminderEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}

  /api/users/{userId}/taste-onboarding:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProfileUnlock'
      - name: X-Client-ID
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      operationId: getTasteOnboarding
      summary: Read this profile's optional starting interests
      description: Returns only titles still allowed by the current profile policy. No automatic import, external activity or rating write occurs.
      responses:
        '200':
          description: Current setup status and editable interests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TasteOnboardingState'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: updateTasteOnboarding
      summary: Save starting interests, skip setup or explicitly use existing profile history
      description: |
        Manual selections contain only coordinates delivered to this profile/client.
        Skip preserves previously saved interests. Save with an empty array clears
        the selection without changing ratings, history, lists or external services.
        History uses only actual, usable watched titles already saved for this adult
        profile; it never imports another profile or enables an external service.
        Child selection uses the dedicated candidate endpoint and known rating caps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, enum: [save, skip, history]}
                titles:
                  type: array
                  nullable: true
                  maxItems: 40
                  description: Required for save; other actions accept only an empty or omitted selection.
                  items:
                    type: object
                    additionalProperties: false
                    required: [titleId, mediaType]
                    properties:
                      titleId: {type: string, minLength: 1, maxLength: 128}
                      mediaType: {type: string, enum: [movie, series]}
      responses:
        '200':
          description: Saved status and selection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TasteOnboardingState'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      operationId: clearTasteOnboarding
      summary: Remove only this profile's starting selection and setup status
      description: Remains possible after a profile restriction change; previously disallowed title metadata is not returned.
      responses:
        '200':
          description: Reset setup state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TasteOnboardingState'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/users/{userId}/taste-onboarding/candidates:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProfileUnlock'
      - name: X-Client-ID
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - name: kind
        in: query
        required: true
        schema: {type: string, enum: [movie, series]}
      - name: q
        in: query
        schema: {type: string, maxLength: 200}
    get:
      operationId: getTasteOnboardingCandidates
      summary: Find titles for the optional profile setup
      description: |
        At most 24 allowed catalogue titles are returned. Current child rating caps
        are applied before delivery; unknown or mature titles are excluded. This
        search does not create ordinary search interests or queue Usenet work.
        Empty q uses deferred-artwork discovery. The metadata request is bounded.
      responses:
        '200':
          description: Delivered candidate titles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 24
                    items: {$ref: '#/components/schemas/TrendingItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/users/{userId}/post-play/{mediaType}/{titleId}:
    parameters:
      - {in: path, name: userId, required: true, schema: {type: string}}
      - {in: path, name: mediaType, required: true, schema: {type: string, enum: [movie, series]}}
      - {in: path, name: titleId, required: true, schema: {type: string, maxLength: 128}}
      - {in: query, name: itemId, schema: {type: string, maxLength: 512}, description: Canonical completed progress item. Required for a series episode.}
    get:
      operationId: getPostPlayContext
      summary: Read an owned completed title and its existing personal rating
      description: |
        Requires a full owned profile session, client identity and PIN unlock.
        Only an existing server catalogue identity for this profile/client and
        matching played watch history may renew the ordinary rating projection.
        A bounded in-memory identity retained for up to 24 hours supports long
        movies; ordinary rating requests retain their 30-minute lifetime.
        Marked or imported history alone does not authorize renewal. The read
        never changes ratings, watched state, lists or saved starting interests.
        An episode response labels the rating as the whole series and does not
        claim that the series has ended or that a future episode is playable.
      responses:
        '200':
          description: Verified completion context and current personal rating
          headers:
            Cache-Control: {schema: {type: string}, description: Private and no-store}
          content:
            application/json:
              schema:
                type: object
                required: [title, rating, ratingScope, completion]
                properties:
                  title: {$ref: '#/components/schemas/Title'}
                  rating: {type: string, enum: [none, like, love, dislike]}
                  ratingScope: {type: string, enum: [movie, series]}
                  completion: {type: string, enum: [movie, episode]}
        '400': {description: Invalid coordinates or missing completed episode identity}
        '403': {description: Locked profile or restricted session}
        '404': {description: Profile or title unavailable under the current policy}
        '409': {description: Reload the title or wait for played history to be recorded}
        '503': {description: Stored completion context or preferences unavailable}
  /api/users/{userId}/post-play/{mediaType}/{titleId}/recommendations:
    parameters:
      - {in: path, name: userId, required: true, schema: {type: string}}
      - {in: path, name: mediaType, required: true, schema: {type: string, enum: [movie, series]}}
      - {in: path, name: titleId, required: true, schema: {type: string, maxLength: 128}}
      - {in: query, name: itemId, schema: {type: string, maxLength: 512}, description: Canonical completed progress item. Required for a series episode.}
    get:
      operationId: getPostPlayRecommendations
      summary: Read bounded current profile suggestions after verified playback
      description: |
        Uses the same completion, ownership and PIN checks as post-play context.
        Returns at most six movies and six series. Current seen/progress,
        hidden-title, explicit dislike and child policies are reapplied.
        Recommendation metadata work is bounded to two seconds and does not
        prepare streams or warm ratings/artwork. Cached profile suggestions and
        verified saved choices provide fallback when external recommendations
        fail. A disliked seed cannot reuse its earlier positive cached context.
        Titles are candidates; this endpoint does not assert source playability.
      responses:
        '200':
          description: Suggestions or an explicitly unavailable empty result
          headers:
            Cache-Control: {schema: {type: string}, description: Private and no-store}
          content:
            application/json:
              schema:
                type: object
                required: [items, total, source, rating, ratingScope]
                properties:
                  items: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/TrendingItem'}}
                  total: {type: integer, minimum: 0, maximum: 12}
                  source: {type: string, enum: [personalized, saved_choices, unavailable]}
                  rating: {type: string, enum: [none, like, love, dislike]}
                  ratingScope: {type: string, enum: [movie, series]}
        '400': {description: Invalid coordinates or missing completed episode identity}
        '403': {description: Locked profile or restricted session}
        '404': {description: Profile or title unavailable under the current policy}
        '409': {description: Reload the title or wait for played history to be recorded}
        '503': {description: 'Stored preferences, history or hidden-title policy unavailable'}
  /api/users/{userId}/ratings/{mediaType}/{titleId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProfileUnlock'
      - name: X-Client-ID
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - name: mediaType
        in: path
        required: true
        schema: {type: string, enum: [movie, series]}
      - name: titleId
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      operationId: getPersonalTitleRating
      summary: Read the active profile's explicit preference for a delivered title
      responses:
        '200':
          description: Current preference, or none
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonalTitleRating'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
    put:
      operationId: setPersonalTitleRating
      summary: Set or clear an explicit profile preference
      description: |
        Requires an owned unlocked profile, full account session and a title
        delivered to this profile/client during the last thirty minutes. Current
        child-profile policy is checked again. Only the preference is accepted;
        metadata and provider aliases come from the server. Preferences remain
        separate from watched, hidden and watchlist state. No external sync is
        enabled. Dislikes override implicit recommendation signals; love and like
        remain seeds after old playback ages out. Use none to remove a preference.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonalTitleRating'}
      responses:
        '200':
          description: Preference saved or cleared
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonalTitleRating'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
  /api/users/{userId}/source-availability/recheck:
    post:
      operationId: recheckSourceAvailability
      summary: Request a bounded explicit source recheck
      description: |
        Requires an owned unlocked profile and client identity. Title metadata
        must have been delivered to that profile/client; exact episode coordinates
        are resolved against current server metadata. Repeated queued requests
        share one job and never extend its two-minute deadline. Completed actions
        have a one-minute per-profile/title cooldown. Existing provider budget,
        foreground priority and local file/audio checks remain in force.
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - name: X-Client-ID
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [titleId, mediaType]
              properties:
                titleId: {type: string, minLength: 1, maxLength: 128}
                mediaType: {type: string, enum: [movie, series]}
                numbering: {$ref: '#/components/schemas/EpisodeNumbering'}
                episode:
                  type: object
                  additionalProperties: false
                  required: [episodeId, seasonNumber, episodeNumber]
                  properties:
                    episodeId: {type: string, minLength: 1}
                    seasonNumber: {type: integer, minimum: 0}
                    episodeNumber: {type: integer, minimum: 1}
      responses:
        '202':
          description: Queued or already queued; completion appears in normal visible hints
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, retryAfterSeconds]
                properties:
                  status: {type: string, enum: [queued]}
                  retryAfterSeconds: {type: integer, minimum: 1}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

  /api/users/{userId}/source-availability/titles/{viewID}:
    put:
      operationId: updateVisibleTitleSourceHints
      summary: Replace visible title source-check demand and read cached hints
      description: |
        Requires profile ownership, its unlock token and a client identity. Up to
        24 coordinates reuse catalogue metadata previously delivered to the same
        profile and client; missing projections stay unknown until catalogue refresh. No provider query or release name is accepted. A view lease
        expires after 30 seconds; empty titles release it without metadata I/O.
        Versions must increase, including cleanup. Replies are private/no-store.
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - name: X-Client-ID
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: viewID
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, titles]
              properties:
                version: {type: integer, format: int64, minimum: 1}
                titles:
                  type: array
                  maxItems: 24
                  items:
                    type: object
                    additionalProperties: false
                    required: [titleId, mediaType]
                    properties:
                      titleId: {type: string, minLength: 1, maxLength: 128}
                      mediaType: {type: string, enum: [movie, series]}
      responses:
        '200':
          description: Cached profile/title hints; provider work remains asynchronous
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, version, items]
                properties:
                  enabled: {type: boolean}
                  version: {type: integer, format: int64}
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [titleId, mediaType]
                      properties:
                        titleId: {type: string}
                        mediaType: {type: string, enum: [movie, series]}
                        sourceAvailability: {$ref: '#/components/schemas/SourceAvailability'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}

  /api/users/{userId}/source-availability/episodes/{viewID}:
    put:
      operationId: updateVisibleEpisodeSourceHints
      summary: Replace visible episode source-check demand and read cached hints
      description: |
        Requires profile ownership, its unlock token and a client identity. Up to
        12 coordinates are verified against server metadata in the selected
        numbering. No provider query or release name is accepted. A view lease
        expires after 30 seconds; empty episodes release it without metadata I/O.
        Versions must increase, including cleanup. Replies are private/no-store.
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - name: X-Client-ID
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: viewID
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, episodes]
              properties:
                version: {type: integer, format: int64, minimum: 1}
                titleId: {type: string, maxLength: 128}
                numbering: {$ref: '#/components/schemas/EpisodeNumbering'}
                episodes:
                  type: array
                  maxItems: 12
                  items:
                    type: object
                    additionalProperties: false
                    required: [episodeId, seasonNumber, episodeNumber]
                    properties:
                      episodeId: {type: string}
                      seasonNumber: {type: integer, minimum: 0}
                      episodeNumber: {type: integer, minimum: 1}
      responses:
        '200':
          description: Cached profile/episode hints; provider work remains asynchronous
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, version, items]
                properties:
                  enabled: {type: boolean}
                  version: {type: integer, format: int64}
                  episodeCoverage: {$ref: '#/components/schemas/EpisodeSourceCoverage'}
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [episodeId, seasonNumber, episodeNumber]
                      properties:
                        episodeId: {type: string}
                        seasonNumber: {type: integer}
                        episodeNumber: {type: integer}
                        sourceAvailability: {$ref: '#/components/schemas/SourceAvailability'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}

  /api/users/{userId}/settings:
    get:
      operationId: getEffectiveProfileSettings
      summary: Get effective profile settings and server playback capabilities
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Effective settings. Capability markers are response-only and never persisted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [automaticLibrarySelectionSupported, stationFavoritesSupported]
                properties:
                  automaticLibrarySelectionSupported:
                    type: boolean
                    enum: [true]
                    readOnly: true
                  stationFavoritesSupported:
                    type: boolean
                    enum: [true]
                    readOnly: true
                  liveTV:
                    type: object
                    additionalProperties: true
                    properties:
                      favoriteStationIds: {$ref: '#/components/schemas/FavoriteStationIds'}
        '404':
          $ref: '#/components/responses/Error'

  /api/users/{userId}/live-tv/station-favorites:
    put:
      operationId: setProfileStationFavorite
      summary: Add or remove one profile-wide station favorite
      description: |
        Idempotently updates only favoriteStationIds. Existing per-stream
        favoriteChannels and all unrelated settings remain unchanged. Requires
        a full owned account session, profile unlock and an adult profile.
        Does not fetch a playlist or open a stream. General settings PUTs
        cannot overwrite this field from an omitted or stale snapshot.
        Bookmarks do not grant access to a provider or broadcast variant.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stationId, favorite]
              properties:
                stationId: {$ref: '#/components/schemas/FavoriteStationId'}
                favorite: {type: boolean}
      responses:
        '200':
          description: Current profile station favorites, always an array
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StationFavoriteSnapshot'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

  /api/users/{userId}/settings/skipping:
    patch:
      operationId: patchProfileSkipping
      summary: Patch profile auto-skip and next-episode preferences
      description: |
        Updates only supplied playback choices and preserves unrelated settings.
        Values are stored per profile and returned by GET /api/users/{userId}/settings
        as playback.introAutoSkip, playback.recapAutoSkip, playback.creditsAutoSkip
        and playback.nextEpisodeAutoPlay. The `nextEpisode` choice independently
        controls automatic next-episode playback, including at genuine media end.
        Missing legacy values default to enabled after a successful settings read.
        General settings PUTs cannot overwrite this choice from an older snapshot.
        Requires ownership of the profile and its unlock token when PIN enforcement is on.
        Clients must not import unscoped browser preferences into an arbitrary profile.
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                intro: {type: boolean}
                recap: {type: boolean}
                credits: {type: boolean}
                nextEpisode: {type: boolean}
      responses:
        '200':
          description: Supplied preferences saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  intro: {type: boolean}
                  recap: {type: boolean}
                  credits: {type: boolean}
                  nextEpisode: {type: boolean}
        '400':
          description: Empty, unknown or malformed preferences
        '403':
          description: Profile PIN required
        '404':
          description: Profile not owned by this account

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Create a session token
      description: |
        Rate limited to 5 attempts per minute per IP. A master account still
        using the default bootstrap password gets 428 with
        `code: default_password`; resubmit with `newPassword`. Wrong
        credentials answer 401 `invalid_credentials`; an expired account
        answers 401 `account_expired`.
        Sessions last 30 days with `rememberMe`, otherwise the server default.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the session token and extend its lifetime
      description: |
        Issues a **new** token and deletes the presented one: the old token
        is rejected (401 `session_expired`) from the moment this call
        succeeds, so store the new token before issuing further requests.
        The new session lasts the server's default session duration.
        Profile unlock tokens issued to the old session are carried over to
        the new one (no PIN re-prompt). Share-link (stream-scoped) sessions
        cannot be refreshed. The token must be sent in the `Authorization`
        header.
      parameters:
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Token rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: |
        Deletes the session token from the `Authorization` header and every
        profile unlock issued to it. Already-revoked tokens are treated as
        success.
      parameters:
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /api/version:
    get:
      tags: [auth]
      operationId: getVersion
      summary: Backend version
      description: Unauthenticated; usable as a reachability probe.
      security: []
      responses:
        '200':
          description: Version information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /api/users:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List the signed-in account's profiles
      parameters:
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Profiles owned by the account, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'

  /api/users/{userId}/pin/verify:
    post:
      tags: [profiles]
      operationId: verifyProfilePin
      summary: Check a profile PIN and obtain a profile unlock token
      description: |
        On success returns `valid: true` plus an `unlockToken` bound to the
        calling session and this profile. Send it as `X-Profile-Unlock` (or
        `?profileUnlock=` on media URLs) on requests for this profile. A
        profile without a PIN also verifies (any PIN) and gets a token.

        A wrong PIN answers **401** with `{"error": "invalid PIN", "code":
        "pin_invalid"}` (`pin_required` when the PIN is empty). This 401 does
        not mean the session expired — do not refresh or sign out on it.
        Rate limited to 10 attempts per minute per IP (429 `rate_limited`).
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/ClientID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinVerifyRequest'
      responses:
        '200':
          description: PIN accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinVerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/users/{userId}/history/continue:
    get:
      tags: [history]
      operationId: listContinueWatching
      summary: Continue Watching shelf
      description: |
        Each item carries a server-computed `resume` describing what it would
        play (the movie, or `nextEpisode` for a series). Offer Resume only when
        `resume.eligible`.
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      responses:
        '200':
          description: Continue Watching items, most recent first. Older servers may send `null` for an empty shelf.
          content:
            application/json:
              schema:
                type: [array, 'null']
                items:
                  $ref: '#/components/schemas/SeriesWatchState'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
