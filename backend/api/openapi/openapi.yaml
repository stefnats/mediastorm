  /api/users/{userId}/state/reload:
    post:
      operationId: reloadProfileState
      summary: Explicitly reload one saved profile state
      description: |
        PG-only historical read/adopt of one current owned profile and its
        settings, with joint local cache installation under both service locks.
        The request is bodyless and accepts no query overrides, parent intent,
        account password, desired values or automatic mutation retry.
        Current full-session, ownership and existing route PIN policy remain
        required before and after the read. Cookie routes additionally require
        the existing same-origin POST transport. No PIN or parent grant is issued.

        Every clone/check completes before both original read slots are consumed.
        Once jointly consumed, both local installations finish even if the
        request then ends; a late response is suppressed without claiming rollback.
        This is historical bookkeeping, not a permanent freshness guarantee.
        It performs no database mutation, defaults, provider work or constructor
        migration and does not replay the failed save. Missing PG support is 503,
        with no JSON/legacy fallback.

        usersWriteBlocked preserves the existing global Users uncertainty gate.
        settingsPendingUncertainty describes remaining settings uncertainty only;
        it is not a new global write block or an authorization grant. Foreign
        markers and unsaved local values are preserved. The safe profile is
        returned directly; no second unbound Profiles read is required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The safely projected profile and separate historical recovery status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileStateRecovery'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

