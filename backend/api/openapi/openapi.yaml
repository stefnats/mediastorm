  /api/users/{userId}/display-list:
    get:
      tags: [lists]
      operationId: getDisplayList
      summary: Server-sorted, filtered and paged list for shelves and list screens
      description: |
        The server sorts and filters before paging; never re-sort pages on the
        client. Use `total` for paging and `genres` for filter facets.
        `items` is `WatchlistItem[]` for `watchlist` / `custom-list`,
        `TrendingItem[]` for `permanent-prequeue` and custom-list shelves,
        `HiddenItem[]` for the complete stored `hidden` management index,
        `LovedStoredItem[]` for the complete `loved-stored` browse view,
        plain `Title[]` for `collection-cached`,
        whitelisted `CachedContinueWatchingItem[]` for `continue-watching-cached`, and
        the delegated metadata payload (usually `TrendingItem[]`) for
        discovery sources.
      parameters:
        - name: originalLanguages
          in: query
          description: |
            Up to 32 distinct registered canonical ISO639-3 codes, separated by
            commas. Supported only for stored watchlist, custom-list (including
            aliases and custom-list shelves), permanent-prequeue, hidden, loved-stored
            and collection-cached / continue-watching-cached. Matches
            current cached provider original-language facts before paging;
            missing, expired or unbound facts are unknown. No provider lookup
            is started. Invalid or unsupported active queries return 400.
          schema:
            type: string
            maxLength: 128
        - name: includeUnknownOriginalLanguage
          in: query
          description: Include unknown original language in addition to selected codes; alone selects only unknown items. False with no codes leaves the list unfiltered.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/UserID'
        - name: source
          in: query
          description: |
            List source. Defaults to `watchlist`. Also: `custom-list` (needs
            `listId`), `hidden`, `continue-watching`, `permanent-prequeue`, `top-ten`,
            `popular-on-server`, `recently-watched`, `trending`, `genre`,
            `decade`, `mdblist`, `stremio`, `tmdb-list`, `trakt-list`,
            `publicmetadb-list`, `simkl-list`, `letterboxd-list`,
            `personalized`, `loved`, `loved-stored`, `custom-ai`, `similar`, `collection`, `collection-cached`, `continue-watching-cached`.
            `continue-watching-cached` is an explicit adult-profile cache browse.
            Only the normal Continue Watching producer can capture its complete
            service feed before the legacy display cap. Pools are independent
            whitelist projections with at most 4096 rows / 4 MiB and 32 profile
            pools. Original expiry is at most 10 minutes, or 30 seconds for an
            estimated episode airtime. Cache reads never renew or rebuild it.
            Missing, expired, invalid, evicted or revision-lost pools return 409
            code continue_watching_snapshot_unavailable; a missing reader is 503.
            Current Hidden and Set Aside records and verified cached original
            language selection precede total and paging. Supports titleFilter,
            filterMediaType, alphabet and default/name/year sorting; limit=0
            returns the complete matching observed pool without the discovery cap.
            Watched, genre, runtime, rating, count, facets and added-sort requests
            return 400. No cold builder, metadata, identity repair, recording
            repository, Plex, artwork, prequeue or delivery-receipt work occurs.
            Whitelist rows retain canonical episode/history/resume coordinates,
            omit private URL/path/maps, and are not playback or history grants.
            Pool correlation does not freeze language or suppression facts.
            Existing normal Continue Watching/next-episode and Recently Watched
            privacy windows are unchanged. A normal explicit Continue Watching
            read remains its existing producer; no automatic fallback is allowed.
            `collection-cached` is an explicit adult-only cache browse, separate
            from the normal collection GET. Requires collectionId (or matching id).
            Only a complete normal TMDB collection response with its actual ID,
            explicit parts array, unique valid IDs and at most 4096 members / 4 MiB
            can populate the language-specific snapshot. It expires within 24 hours
            or the shorter existing cache TTL. Browsing never refreshes it;
            missing, expired, malformed or unavailable snapshots return 409 with
            code collection_snapshot_unavailable, never an empty success or
            automatic provider request. An actual observed empty array is valid.
            Existing GET /api/metadata/collection is the explicit normal reload.
            Supports original language, titleFilter, filterMediaType, alphabet,
            default/year chronological ordering (undated last) and name sorting.
            Hidden and verified cache language selection precede total/page;
            limit=0 returns the entire matching pool with no 500-item discovery cap.
            Unsupported genre/watched/runtime/rating/count/facet/added requirements
            return 400 before reading the snapshot. Only already captured primary
            release dates feed existing unreleased visibility; no release-window
            warmup, History, artwork fetch, enrichment, source or prequeue work.
            The collection response identifies original observation and expiry.
            No global catalogue completeness, immutable pages, file/audio/age
            proof or playback permission is granted. Existing collection route,
            kids enrichment and legacy semantics remain separate.
            `hidden` reads every saved suppression marker for the owned profile,
            without applying suppression to itself or starting metadata/history,
            artwork, source, prequeue or provider work. Its IDs and hiddenAt stay
            unchanged. Supports original language, titleFilter, filterMediaType,
            alphabet and default/added(hiddenAt)/name/year sorting before total
            and pagination. Watched/genre/runtime/rating/count requirements, ratingSource and
            includeFacets=true return
            400. limit=0 yields the complete matching Random pool, not discovery.
            `loved-stored` is a separate complete saved Love-rating browse view.
            It requires the existing owned profile, PIN, client and kids checks.
            Hidden suppression and cached original-language selection run before
            total, alphabet facets and paging, with no discovery 500-item cap.
            Stored IDs, names, kinds, years and rating updatedAt are preserved.
            Items have rank, title (personalRating=love), and updatedAt; rank is
            the one-based position in the effective sorted collection. Default
            order is updatedAt descending, then kind and ID. sortBy=added means
            the saved rating updatedAt, not when the catalogue title was added.
            Only titleFilter, filterMediaType, alphabet and default/added/name/year
            sorting are supported. Active watched/hideWatched, hideUnreleased,
            genre/runtime/rating/count requirements, ratingSource, and general
            includeFacets=true return 400 before reading preferences or language
            facts. No history, artwork, provider, source, reminder or prequeue
            work is started. Missing required readers return 503; missing or
            expired exact cached language facts are unknown. total is the full
            effective count; limit=0 returns the full matching Random pool.
            Only returned titles enter the existing profile/client rating-edit
            receipt store (2000 entries, 30-minute TTL and existing eviction).
            A large Random pool therefore does not promise every row remains
            editable without reloading. No playback, file or age grant follows.
            originalLanguageFilterSupported=true is returned on this source even
            without an active language filter. Responses are private, no-store.
            `loved` reads the active profile's existing Love ratings, with current
            profile/PIN/child restrictions, bounded paging and cache-only artwork;
            it does not create another list or start provider searches.
          schema:
            type: string
            default: watchlist
        - name: listId
          in: query
          schema:
            type: string
        - name: collectionId
          in: query
          description: Positive canonical collection ID for collection-cached; conflicting id aliases reject.
          schema: {type: integer, format: int64, minimum: 1}
        - name: id
          in: query
          description: Existing collection ID alias; must agree with collectionId when both are supplied.
          schema: {type: integer, format: int64, minimum: 1}
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [default, added, name, year, duration, rating]
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: ratingSource
          in: query
          description: Rating source used by `sortBy=rating` (for example `imdb`, `tmdb`).
          schema:
            type: string
        - name: genres
          in: query
          description: Comma-separated genre names; an item matches if it has any of them.
          schema:
            type: string
        - name: watchStatus
          in: query
          description: |
            `none`/`partial`/`complete`, or the aliases `unwatched`,
            `in_progress`, `watched`. `all` disables the filter.
          schema:
            type: string
        - name: titleFilter
          in: query
          description: Case-insensitive substring match on the title.
          schema:
            type: string
        - name: filterMediaType
          in: query
          schema:
            type: string
            enum: [all, movie, series]
        - name: alphabet
          in: query
          description: Restrict to one alphabet bucket from `alphabetBuckets`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: includeFacets
          in: query
          schema:
            type: boolean
        - name: includeUnwatchedCounts
          in: query
          schema:
            type: boolean
        - name: homeView
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      responses:
        '200':
          description: One page of the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Requested collection snapshot is unavailable; only explicit normal reload may contact the provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          $ref: '#/components/responses/Error'

  /api/video/hls/{sessionID}/seek:
    post:
      tags: [video]
      operationId: seekHlsSession
      summary: Seek a legacy HLS session or explicitly restart the dormant pipe subset at zero
      description: |
        Nil/uninstalled legacy seek behavior is unchanged. The dormant configured
        normal H264/AAC TS pipe subset accepts only one explicitly claimed
        restart at zero per original session, for at most two input attempts.
        Its time must be the single canonical query string 0. Body, source/path,
        track, target, start and other setup flags are rejected before demand.
        The exact original full session/client, consistent explicit profile,
        current PIN/source ACL and unchanged explicitly inactive applicability
        are required. Unknown or active applicability fails closed. Original
        private authority and its absolute expiry are never reissued or renewed.
        Old process/body/pump must join before a successor GET can open. Each
        attempt uses a fresh single GET and confined prefix/probe/pipe, with
        unique directory and exact runtime/generation replacement. Setup follows
        request cancellation until successful explicit handoff, then survives
        HTTP completion only within the unchanged original authority deadline.
        A failed/canceled reservation cannot be retried. Position greater than
        zero, automatic recovery and Cast/Live/HDR/HW/CC remain unsupported with
        this dormant boundary. No remux/continuous timeline, immutable-file or
        age permission is implied. Main does not install the boundary; this
        documents an existing endpoint, not public family-policy activation.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: {type: string}
        - name: time
          in: query
          required: true
          description: Seconds for legacy seek; exactly one canonical 0 for configured zero restart.
          schema: {type: number, minimum: 0}
        - $ref: '#/components/parameters/StreamProfileID'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      responses:
        '200':
          description: Setup handed off; not a guarantee of future stream availability or a file/age grant.
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, playlistUrl, startOffset, actualStartOffset, keyframeDelta]
                properties:
                  sessionId: {type: string}
                  playlistUrl: {type: string}
                  startOffset: {type: number}
                  actualStartOffset: {type: number}
                  keyframeDelta: {type: number}
                  duration: {type: number}
                  stableCastTimeline: {type: boolean}
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/indexers/search:
    get:
      tags: [sources]
      operationId: searchSources
      summary: Search configured indexers and scrapers for playable sources
      description: |
        Plain searches return `IndexerResult[]`. `includeFiltered=true` adds
        scoring fields (and filtered-out results); adding
        `includeAdaptiveSummary=true` wraps the list in
        `IndexerSearchEnvelope`. With `includeSourceHealth=true` each result
        carries `sourceHealth`; poll `/api/indexers/source-health` with the
        token of `pending` results.
        With sourceFiltersVersion=1 an owned full-session profile receives a
        bounded retained snapshot before presentation caps. Provider fetch budgets
        remain unchanged. Only the normal initial visible health budget is used.
        A target is request correlation, never verified catalogue eligibility.
      parameters:
        - name: sourceFiltersVersion
          in: query
          schema: {type: integer, enum: [1]}
        - name: episodeId
          in: query
          schema: {type: string, maxLength: 1024}
        - name: seasonNumber
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000}
        - name: episodeNumber
          in: query
          schema: {type: integer, minimum: 1, maximum: 100000}
        - name: q
          in: query
          description: Search text (title, plus `SxxEyy` for episodes).
          schema:
            type: string
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: imdbId
          in: query
          schema:
            type: string
        - name: titleId
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum results (default 5).
          schema:
            type: integer
            minimum: 1
        - name: cat
          in: query
          description: Newznab categories; repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: '#/components/parameters/UserIDQuery'
        - name: clientId
          in: query
          description: Fallback when the `X-Client-ID` header cannot be sent.
          schema:
            type: string
        - name: episodeNumberingId
          in: query
          schema:
            type: string
        - name: episodeOrdering
          in: query
          schema:
            type: string
        - name: includeFiltered
          in: query
          schema:
            type: boolean
        - name: includeAdaptiveSummary
          in: query
          description: Only honoured with `includeFiltered=true`.
          schema:
            type: boolean
        - name: includeSourceHealth
          in: query
          schema:
            type: boolean
        - name: downloadRanking
          in: query
          schema:
            type: boolean
        - name: seasonPacks
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - $ref: '#/components/parameters/AdaptiveThroughputMbps'
        - $ref: '#/components/parameters/AdaptiveThroughputMeasuredAt'
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/IndexerResult'
                  - $ref: '#/components/schemas/IndexerSearchEnvelope'
                  - $ref: '#/components/schemas/SourceFilterPage'
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/SearchError'
        '504':
          $ref: '#/components/responses/SearchError'

  /api/users/{userId}/source-searches/{snapshotId}/page:
    post:
      tags: [sources]
      operationId: sourceSearchPage
      summary: Filter or page an existing owned source snapshot without I/O
      description: |
        Cache-only. No provider, metadata, preparation, probe or health call is
        initiated. Rows preserve original result data and immutable sourceIndex.
        total counts displayed matches plus included unknowns across the retained
        pool; matchedTotal and unknownTotal count both categories independently.
        No predicates yields unfiltered rows with both evidence counts zero.
        Views freeze order, counts and proof and expire at the earliest proof
        deadline, including proof that excluded a row. A fresh explicit probe
        invalidates old views. Apply without cursor creates another cache-only
        view. Snapshot/context expiry requires an explicit ordinary reload.
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string}
        - name: snapshotId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceFilterPageRequest'}
      responses:
        '200':
          description: One immutable view page, never a playback or catalogue grant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceFilterPage'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: source_view_expired/source_view_changed permit cache-only Apply; source_snapshot_context_changed requires explicit reload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}

  /api/usenet/health:
    post:
      tags: [sources]
      operationId: checkUsenetHealth
      summary: Run the existing explicit Usenet health or requested track check
      description: Optional mediaEvidence reports only work already performed. Caller result attributes never establish a catalogue or episode binding; source-only facts do not establish playback eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExplicitHealthRequest'}
      responses:
        '200':
          description: Existing health result with optional source-only input metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExplicitHealthResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}

  /api/debrid/cached:
    post:
      tags: [sources]
      operationId: checkDebridCached
      summary: Run the existing explicit debrid cache or requested verification check
      description: The optional evidence does not start additional work. Legacy cached tracks lacking exact input/probe provenance remain unknown. Movie and caller-supplied episode associations are not inferred.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExplicitHealthRequest'}
      responses:
        '200':
          description: Existing cache result with optional source-only input metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExplicitHealthResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}

  /api/indexers/source-health:
    get:
      tags: [sources]
      operationId: pollSourceHealth
      summary: Long-poll pending source health checks
      parameters:
        - name: token
          in: query
          required: true
          description: '`sourceHealth.token` of a pending result.'
          schema:
            type: string
        - name: waitMs
          in: query
          description: Long-poll wait in milliseconds (capped at 25000). Without it the current snapshot returns immediately.
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Snapshot; apply each entry by `index` into the original result list. Poll again until `complete`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceHealthSnapshot'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/playback/prequeue:
    post:
      tags: [playback]
      operationId: startPrequeue
      summary: Start (or reuse) a background search, resolve and probe
      description: |
        For series without `seasonNumber`/`episodeNumber` the server picks the
        next episode from watch history (falling back to S01E01). Poll
        `GET /api/playback/prequeue/{prequeueId}` until `ready` or `failed`.
        The body is strict: unknown fields are rejected with 400.
      parameters:
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - $ref: '#/components/parameters/AdaptiveThroughputMbps'
        - $ref: '#/components/parameters/AdaptiveThroughputMeasuredAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrequeueRequest'
      responses:
        '200':
          description: Prequeue accepted (new, in progress or already ready).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrequeueResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'

  /api/playback/prequeue/{prequeueId}:
    get:
      tags: [playback]
      operationId: getPrequeueStatus
      summary: Prequeue status, stream path and track selection
      parameters:
        - name: prequeueId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Current status; stream and track fields are filled once `ready`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrequeueStatusResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/playback/resolve:
    post:
      tags: [playback]
      operationId: resolveSource
      summary: Resolve a manually picked search result into a stream path
      description: |
        Send `includeTrackSelection: true` with `profileId`, `titleId` and the
        `X-Client-ID` header to get the server's audio/subtitle choice. When
        the result is queued (`queueId` > 0 and no `webdavPath`), poll
        `/api/playback/queue/{queueId}`.
      parameters:
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackResolution'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The source is marked bad (resend with `allowMarkedBad` to override).
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Unsupported source (for example `.m2ts`).
          content:
            text/plain:
              schema:
                type: string
        '502':
          $ref: '#/components/responses/Error'

  /api/playback/queue/{queueId}:
    get:
      tags: [playback]
      operationId: getQueueStatus
      summary: Status of a queued resolve
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: includeTrackSelection
          in: query
          schema:
            type: boolean
        - name: profileId
          in: query
          schema:
            type: string
        - name: titleId
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
      responses:
        '200':
          description: Resolution once ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackResolution'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: Unsupported source.
          content:
            text/plain:
              schema:
                type: string
        '502':
          $ref: '#/components/responses/Error'

  /api/video/stream:
    get:
      tags: [playback]
      operationId: streamVideo
      summary: Raw or transmuxed media stream
      description: |
        Supports HTTP range requests for direct play. Native clients use
        `transmux=0` and play the container directly. Concurrent stream
        limits (global, per profile, per account) are enforced on GET only and
        answer 429 with `StreamLimitError`.
      security:
        - bearerAuth: []
        - queryToken: []
      parameters:
        - $ref: '#/components/parameters/StreamPath'
        - $ref: '#/components/parameters/StreamTransmux'
        - $ref: '#/components/parameters/StreamTarget'
        - $ref: '#/components/parameters/StreamProfileID'
        - $ref: '#/components/parameters/StreamUserID'
        - $ref: '#/components/parameters/StreamProfileName'
        - $ref: '#/components/parameters/StreamDisplayName'
        - $ref: '#/components/parameters/StreamClientID'
        - $ref: '#/components/parameters/StreamDV'
        - $ref: '#/components/parameters/StreamFormat'
        - $ref: '#/components/parameters/StreamDLNAProfile'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - $ref: '#/components/parameters/ProfileUnlockQuery'
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          description: Full media body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a range request.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: A concurrent stream limit was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamLimitError'
        '503':
          $ref: '#/components/responses/Error'
    head:
      tags: [playback]
      operationId: headVideo
      summary: Stream metadata (size, type) without a body
      description: HEAD never counts toward stream limits.
      security:
        - bearerAuth: []
        - queryToken: []
      parameters:
        - $ref: '#/components/parameters/StreamPath'
        - $ref: '#/components/parameters/StreamTransmux'
        - $ref: '#/components/parameters/StreamTarget'
        - $ref: '#/components/parameters/StreamProfileID'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/ProfileUnlock'
        - $ref: '#/components/parameters/ProfileUnlockQuery'
      responses:
        '200':
          description: Headers only.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/video/segments:
    post:
      tags: [playback]
      operationId: resolveSkipSegments
      summary: Intro, recap, credits and preview ranges
      description: |
        Merges IntroDB, SkipDB and the player's chapter names server-side
        (cached). All body fields are optional: providers are queried only for
        a valid `imdbId` + `season` + `episode`; chapters are always merged as
        the lowest-priority source. Re-post when chapters or duration become
        known. `outro` doubles as movie end credits. Provider failures degrade
        to chapter-only results; this endpoint does not fail playback.
      parameters:
        - $ref: '#/components/parameters/ClientID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipSegmentsRequest'
      responses:
        '200':
          description: Resolved segments (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkipSegmentsResponse'
        '400':
          $ref: '#/components/responses/Error'

  /api/clients/register:
    post:
      tags: [clients]
      operationId: registerClient
      summary: Register this device under a profile
      description: |
        Call on start and on profile switch. Display capabilities and
        throughput measurements are not part of registration; they are
        reported through the per-client settings routes (outside this spec).
      parameters:
        - $ref: '#/components/parameters/ClientID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '200':
          description: Registered client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/live/hls/start:
    get:
      operationId: startLivePlayback
      summary: Open an authorized live channel within shared provider capacity
      description: |
        playAttemptId identifies one explicit Play action. Keep it on automatic
        retries and select a new nonce only for a new explicit action.
        Automatic retunes additionally set automaticRetry=true, which suppresses
        preemption even after the bounded nonce history expires. Profile
        takeover rights are read from current server state and apply only within
        the same account. Calls without a nonce cannot initiate takeover.
        A displaced nonce receives LIVE_STREAM_TAKEN_OVER; stop automatic retry.

        Recording interruption needs a separate profile right and a 409 challenge.
        Dismissal sends no retry and preserves the recording. After explicit
        consent, repeat this exact tune with X-Live-Recording-Confirmation.
        The single-use token expires in 30 seconds and binds the actor, device,
        source and current consumers. No recording or viewer names are returned.
        Replacement admission waits for actual provider-input closure; recorded
        portions remain saved with cancelled status and an incomplete reason.
      parameters:
        - $ref: '#/components/parameters/ProfileUnlock'
        - $ref: '#/components/parameters/StreamProfileID'
        - name: url
          in: query
          required: true
          schema:
            type: string
        - name: sourceId
          in: query
          schema:
            type: string
        - name: playAttemptId
          in: query
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{16,80}$'
        - name: X-Live-Recording-Confirmation
          in: header
          description: Opaque challenge sent only after explicit consent to interrupt the recording.
          schema:
            type: string
        - name: automaticRetry
          in: query
          description: Suppress takeover on automatic retunes while retaining nonce revocation checks.
          schema:
            type: boolean
      responses:
        '200':
          description: Direct media URL or HLS session according to the source and target.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isDirect:
                    type: boolean
                  streamUrl:
                    type: string
                  sessionId:
                    type: string
                  playlistUrl:
                    type: string
                  isLive:
                    type: boolean
                  hasClosedCaptions:
                    type: boolean
                  timeshiftWindowSeconds:
                    type: integer
                  stremioStreamIndex:
                    type: integer
                  stremioStreamIndexes:
                    type: array
                    items:
                      type: integer
        '403':
          description: Profile access denied or takeover authority changed while waiting.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/LiveCapacityError'
            text/plain:
              schema:
                type: string
        '409':
          description: Recording confirmation required, expired confirmation, or incomplete handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCapacityError'
        '410':
          description: Playback was taken over; stop automatic retries and offer an explicit Play action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCapacityError'
        '429':
          description: Occupied capacity with no permitted takeover available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCapacityError'
        default:
          description: Invalid or unavailable live source, or failed authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string

  /api/live/recordings/plan:
    get:
      operationId: getRecordingPlan
      summary: Forecast materialized recording overlaps for an owned adult profile
      description: |
        Advisory read-only snapshot, not a reservation. Uses padded windows and
        private recorder inputs against shared source-account caps. Includes other
        accounts in aggregate demand without returning their job IDs or metadata.
        Known cached-guide matches of enabled recording rules are projected for
        at most seven days without creating jobs. Missing or uncovered guide
        windows remain uncertain. Live viewers and external apps are not predicted.
        Missing limits remain unknown. Incomplete or unresolved overlapping jobs
        cannot produce a clear forecast. Runtime atomic admission remains final;
        recordings wait for a free connection and never preempt viewers.
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Only the selected profile's upcoming materialized jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPlan'
        default:
          description: Invalid or unavailable profile, forbidden child profile or unavailable plan.
          content:
            text/plain:
              schema:
                type: string

  /api/live/recordings/preview:
    post:
      operationId: previewRecordingPlan
      summary: Forecast a proposed recording without creating it
      description: |
        Resolves the channel from the selected profile's visible catalog; a
        compatibility sourceUrl field is ignored. No job, provider input or
        capacity lease is created. Use the normal creation route separately to
        schedule a job. Existing pending, starting and running jobs are included,
        subject to the same guide coverage and capacity limitations as the recording plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingPreviewRequest'
      responses:
        '200':
          description: Includes an advisory candidate item with no recording ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPlan'
        default:
          description: Invalid body, unavailable or forbidden profile/channel or unavailable plan.
          content:
            text/plain:
              schema:
                type: string

  /admin/api/live/recordings/plan:
    get:
      operationId: getRecordingPlanAdmin
      summary: Forecast materialized recording overlaps for an owned adult profile
      description: |
        Advisory read-only snapshot, not a reservation. Uses padded windows and
        private recorder inputs against shared source-account caps. Includes other
        accounts in aggregate demand without returning their job IDs or metadata.
        Known cached-guide matches of enabled recording rules are projected for
        at most seven days without creating jobs. Missing or uncovered guide
        windows remain uncertain. Live viewers and external apps are not predicted.
        Missing limits remain unknown. Incomplete or unresolved overlapping jobs
        cannot produce a clear forecast. Runtime atomic admission remains final;
        recordings wait for a free connection and never preempt viewers.
      security:
        - accountSession: []
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Only the selected profile's upcoming materialized jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPlan'
        default:
          description: Invalid or unavailable profile, forbidden child profile or unavailable plan.
          content:
            text/plain:
              schema:
                type: string

