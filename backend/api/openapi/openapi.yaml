components:
  securitySchemes:
    accountSession:
      type: apiKey
      in: cookie
      name: strmr_admin_session
      description: Account-management session; a playback token cannot grant these rights.
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from `POST /api/auth/login`.
    queryToken:
      type: apiKey
      in: query
      name: token
      description: Session token as a query parameter; only accepted on media URLs such as `/api/video/stream`.

  parameters:
    RegionalPolicyIntent:
      name: X-Parent-Intent
      in: header
      required: false
      schema: {type: string, pattern: '^prf_[0-9a-f]{64}$'}
      description: One-shot original regional policy confirmation; no other parent action accepts it.
    ParentKidsFlagIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original flag intent, isolated from all other actions and API/management entries.
      schema: {type: string, pattern: '^pkf_[0-9a-f]{64}$'}
    ParentRatingGenericIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original Generic rating confirmation; cannot authorize any other operation.
      schema: {type: string, pattern: '^prg_[0-9a-f]{64}$'}
    ParentRatingMovieIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original Movie rating confirmation; cannot authorize any other operation.
      schema: {type: string, pattern: '^prm_[0-9a-f]{64}$'}
    ParentRatingTVIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original TV rating confirmation; cannot authorize any other operation.
      schema: {type: string, pattern: '^prt_[0-9a-f]{64}$'}
    ParentRatingPairIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original Pair rating confirmation; cannot authorize any other operation.
      schema: {type: string, pattern: '^prp_[0-9a-f]{64}$'}
    ParentListAddIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original operation-specific opaque confirmation; not valid for another list or mode action.
      schema: {type: string, pattern: '^pla_[0-9a-f]{64}$'}
    ParentListReplaceIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original operation-specific opaque confirmation; not valid for another list or mode action.
      schema: {type: string, pattern: '^plw_[0-9a-f]{64}$'}
    ParentListRemovalIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original one-shot allowed-list removal confirmation; cannot authorize a mode change.
      schema:
        type: string
        pattern: '^pli_[0-9a-f]{64}$'
    ParentModeIntent:
      name: X-Parent-Intent
      in: header
      description: Exactly one original opaque kids-mode confirmation from the first 403. Never a cookie, password or persistent permit.
      schema:
        type: string
        pattern: '^pmi_[0-9a-f]{64}$'
    ParentAccountPassword:
      name: X-Account-Password
      in: header
      description: Original account password, optionally base64-prefixed UTF-8. Never persist, log or put in a URL. It authorizes only the bound original action.
      schema:
        type: string
    SABFallbackQueueID:
      name: queueID
      in: path
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    ProfileUnlock:
      name: X-Profile-Unlock
      in: header
      description: |
        Profile unlock token(s) from `POST /api/users/{userId}/pin/verify`,
        comma-separated when a request names several PIN-protected profiles.
        Required for PIN-protected profiles only when the server enforces
        profile PINs; otherwise ignored.
      schema:
        type: string
    ProfileUnlockQuery:
      name: profileUnlock
      in: query
      description: Query-string form of `X-Profile-Unlock` for media URLs that cannot carry headers.
      schema:
        type: string
    ClientID:
      name: X-Client-ID
      in: header
      description: Stable per-device client ID. The literal `unknown` is treated as missing.
      schema:
        type: string
    UserID:
      name: userId
      in: path
      required: true
      description: Profile ID (from `GET /api/users`).
      schema:
        type: string
    UserIDQuery:
      name: userId
      in: query
      description: Profile ID; applies profile language, kids and visibility rules.
      schema:
        type: string
    TitleIDQuery:
      name: titleId
      in: query
      schema:
        type: string
    NameQuery:
      name: name
      in: query
      schema:
        type: string
    YearQuery:
      name: year
      in: query
      schema:
        type: integer
    IMDBIDQuery:
      name: imdbId
      in: query
      schema:
        type: string
    TMDBIDQuery:
      name: tmdbId
      in: query
      schema:
        type: integer
        format: int64
    TVDBIDQuery:
      name: tvdbId
      in: query
      schema:
        type: integer
        format: int64
    SeasonTypeQuery:
      name: seasonType
      in: query
      description: TVDB episode ordering (`official`, `dvd`, `absolute`, ...). Defaults to the profile's stored choice, else official.
      schema:
        type: string
    AdaptiveThroughputMbps:
      name: X-Adaptive-Throughput-Mbps
      in: header
      description: Client-measured client↔server throughput in Mbps (adaptive playback).
      schema:
        type: number
    AdaptiveThroughputMeasuredAt:
      name: X-Adaptive-Throughput-Measured-At
      in: header
      description: Unix seconds when the throughput was measured.
      schema:
        type: integer
        format: int64
    StreamPath:
      name: path
      in: query
      required: true
      description: '`streamPath` from prequeue status or `webdavPath` from resolve.'
      schema:
        type: string
    StreamTransmux:
      name: transmux
      in: query
      description: '`0`/`false` serves the original container; `1`/`force` forces a transmux.'
      schema:
        type: string
    StreamTarget:
      name: target
      in: query
      description: '`web`/`browser` forces browser-compatible output (AAC audio).'
      schema:
        type: string
    StreamProfileID:
      name: profileId
      in: query
      description: Profile for stream-limit accounting and Active Streams.
      schema:
        type: string
    StreamUserID:
      name: userId
      in: query
      description: Alias for `profileId`.
      schema:
        type: string
    StreamProfileName:
      name: profileName
      in: query
      schema:
        type: string
    StreamDisplayName:
      name: displayName
      in: query
      description: Title shown in Active Streams.
      schema:
        type: string
    StreamClientID:
      name: clientId
      in: query
      schema:
        type: string
    StreamDV:
      name: dv
      in: query
      description: '`true` requests a Dolby Vision-preserving transmux.'
      schema:
        type: boolean
    StreamFormat:
      name: format
      in: query
      schema:
        type: string
    StreamDLNAProfile:
      name: dlnaProfile
      in: query
      schema:
        type: string
    Range:
      name: Range
      in: header
      schema:
        type: string

  responses:
    ParentKidsFlagForbidden:
      description: First PG flag challenge, wrong credentials or existing ownership/PIN denial. No replacement intent on retry.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^pkf_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentRatingGenericForbidden:
      description: First PG challenge, wrong credentials or existing ownership/PIN denial; retries never create replacement intents.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^prg_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentRatingMovieForbidden:
      description: First PG challenge, wrong credentials or existing ownership/PIN denial; retries never create replacement intents.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^prm_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentRatingTVForbidden:
      description: First PG challenge, wrong credentials or existing ownership/PIN denial; retries never create replacement intents.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^prt_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentRatingPairForbidden:
      description: First PG challenge, wrong credentials or existing ownership/PIN denial; retries never create replacement intents.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^prp_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentListAddForbidden:
      description: First PG operation-specific challenge, wrong credentials, or existing ownership/PIN denial; no replacement on retry.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^pla_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentListReplaceForbidden:
      description: First PG operation-specific challenge, wrong credentials, or existing ownership/PIN denial; no replacement on retry.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent: {type: string, pattern: '^plw_[0-9a-f]{64}$'}
        text/plain:
          schema: {type: string}
    ParentListRemovalForbidden:
      description: First PG removal challenge, wrong password, or existing ownership/PIN denial; no challenge replacement on retry.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent:
                type: string
                pattern: '^pli_[0-9a-f]{64}$'
        text/plain:
          schema: {type: string}
    ParentModeForbidden:
      description: First PostgreSQL confirmation challenge, wrong password, or existing ownership/PIN denial. A retry never creates a replacement intent.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              code: {type: string}
              profileId: {type: string}
              parentIntent:
                type: string
                pattern: '^pmi_[0-9a-f]{64}$'
                description: Present only on the first fresh PostgreSQL parent-confirmation challenge.
        text/plain:
          schema: {type: string}
    Forbidden:
      description: |
        Forbidden. `code: profile_locked` (with `profileId`) when the request
        targets a PIN-protected profile without a valid `X-Profile-Unlock`
        while the server enforces profile PINs; the session remains valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
    Error:
      description: 'Error. JSON `{"error": "..."}`, or a plain-text message from older handler paths.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
    SearchError:
      description: Search failed or timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    RegionalChildPolicy:
      type: object
      additionalProperties: false
      required: [version, country, maxMovieAge, maxEpisodeAge]
      properties:
        version: {type: integer, enum: [1]}
        country: {type: string, enum: [DE]}
        maxMovieAge: {type: integer, enum: [0, 6, 12, 16, 18]}
        maxEpisodeAge: {type: integer, enum: [0, 6, 12, 16, 18]}
      description: Explicit DE/FSK configuration, never a verified classification or media grant.
    ProfileCreationChallenge:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            parentIntent: {type: string, pattern: '^pcc_[0-9a-f]{64}$'}
            creationOperation: {type: string, pattern: '^pcr_[0-9a-f]{64}$'}
      description: The initial PG Kids challenge includes both opaque fields; a password rejection may omit them. Neither locator nor challenge is a reusable grant.
    ProfileCreationSavedProfile:
      allOf:
        - $ref: '#/components/schemas/ProfileCreationManagementProfile'
        - type: object
          properties:
            creationOperation: {type: string, pattern: '^pcr_[0-9a-f]{64}$'}
      description: Qualified PG Kids creation adds its original locator. Existing adult/JSON replies keep their prior fields and omit it.
    ProfileCreationManagementProfile:
      type: object
      required: [id, name, hasPin, hasIcon, isKidsProfile, allowShareLinks, allowLiveTakeover, allowRecordingInterruption, activityPrivacy, createdAt, updatedAt]
      description: Explicit safe current management projection. Passwords, PIN hashes, sessions, internal revisions and operation digests are never returned. Empty Kids fields may be omitted by the existing serializer.
      properties:
        id: {type: string}
        accountId: {type: string}
        name: {type: string}
        color: {type: string}
        iconUrl: {type: string}
        hasPin: {type: boolean}
        hasIcon: {type: boolean}
        isKidsProfile: {type: boolean}
        allowShareLinks: {type: boolean}
        allowLiveTakeover: {type: boolean}
        allowRecordingInterruption: {type: boolean}
        activityPrivacy: {type: string}
        kidsMode: {type: string}
        kidsMaxRating: {type: string}
        kidsMaxMovieRating: {type: string}
        kidsMaxTVRating: {type: string}
        kidsAllowedLists:
          type: array
          items: {type: string}
        traktAccountId: {type: string}
        mdblistAccountId: {type: string}
        simklAccountId: {type: string}
        scrobAccountId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProfileCreationReadResult:
      type: object
      required: [outcome, usersWriteBlocked, settingsPendingUncertainty]
      properties:
        outcome:
          type: string
          enum: [pending, created, not_created, changed_or_replaced, unqualified_or_missing]
        profile:
          $ref: '#/components/schemas/ProfileCreationManagementProfile'
        usersWriteBlocked: {type: boolean}
        settingsPendingUncertainty: {type: boolean}
    RecordingProgressCounter:
      type: string
      maxLength: 19
      pattern: '^(0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$'
      description: Canonical decimal DATA from zero through signed int64 maximum; never a JSON number.
    RecordingProgressCommand:
      type: object
      additionalProperties: false
      required: [action, expectedRevision, writerGeneration, incarnation, artifactId, mappingSha256, durationMs, positionMs]
      properties:
        action: {type: string, enum: [from-start, resume, resume-history, touch]}
        expectedRevision: {$ref: '#/components/schemas/RecordingProgressCounter'}
        writerGeneration: {$ref: '#/components/schemas/RecordingProgressCounter'}
        incarnation: {type: string, format: uuid}
        artifactId: {type: string, pattern: '^[a-f0-9]{32}$'}
        mappingSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        durationMs: {type: integer, format: int64, minimum: 1, maximum: 43200000}
        positionMs: {type: integer, format: int64, minimum: 0, maximum: 43200000}
      oneOf:
        - properties:
            action: {enum: [from-start, resume, resume-history]}
            positionMs: {enum: [0]}
        - properties:
            action: {enum: [touch]}
    RecordingProgressTimeline:
      type: object
      additionalProperties: false
      required: [schemaVersion, recordingId, state, coordinateSystem, incarnation, artifactId, mappingRevision, durationMs, spans, sourceStatus, sourceIncomplete, gapsOmitted, observedAt, expiresAt]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        recordingId: {type: string, minLength: 1, maxLength: 128}
        state: {type: string, enum: [known]}
        coordinateSystem: {type: string, enum: [derived-media]}
        incarnation: {type: string, format: uuid}
        artifactId: {type: string, pattern: '^[a-f0-9]{32}$'}
        mappingRevision: {type: string, pattern: '^[a-f0-9]{64}$'}
        durationMs: {type: integer, format: int64, minimum: 1, maximum: 43200000}
        sourceStatus: {type: string, enum: [completed, failed, cancelled]}
        sourceIncomplete: {type: boolean}
        gapsOmitted: {type: boolean}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        spans:
          type: array
          minItems: 2
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [partIndex, startMs, durationMs]
            properties:
              partIndex: {type: integer, minimum: 1, maximum: 256}
              startMs: {type: integer, format: int64, minimum: 0, maximum: 43200000}
              durationMs: {type: integer, format: int64, minimum: 1, maximum: 43200000}
    RecordingProgressSnapshot:
      type: object
      additionalProperties: false
      required: [validUntil, recordingId, incarnation, artifactId, mappingSha256, durationMs, revision, writerGeneration, positionState]
      properties:
        validUntil: {type: string, format: date-time, description: Original effective transaction deadline DATA; not permission or a session TTL.}
        recordingId: {type: string, minLength: 1, maxLength: 128}
        incarnation: {type: string, format: uuid}
        artifactId: {type: string, pattern: '^[a-f0-9]{32}$'}
        mappingSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        durationMs: {type: integer, format: int64, minimum: 1, maximum: 43200000}
        revision: {$ref: '#/components/schemas/RecordingProgressCounter'}
        writerGeneration: {$ref: '#/components/schemas/RecordingProgressCounter'}
        positionState: {type: string, enum: [none, matching, conflict]}
        positionMs: {type: integer, format: int64, minimum: 0, maximum: 43200000}
        atDerivedEnd: {type: boolean}
        historyState: {type: string, enum: [absent, unverifiable, compatible], description: Historical candidate DATA; never permission or a reusable approval.}
        historicalPositionMs: {type: integer, format: int64, minimum: 0, maximum: 43200000}
        historicalAtDerivedEnd: {type: boolean}
      allOf:
        - oneOf:
            - required: [historyState, historicalPositionMs, historicalAtDerivedEnd]
              properties:
                historyState: {enum: [compatible]}
            - not:
                anyOf:
                  - required: [historicalPositionMs]
                  - required: [historicalAtDerivedEnd]
              properties:
                historyState: {enum: [absent, unverifiable]}
      oneOf:
        - properties:
            positionState: {enum: [matching]}
          required: [positionMs, atDerivedEnd]
        - properties:
            positionState: {enum: [none, conflict]}
          not:
            anyOf:
              - required: [positionMs]
              - required: [atDerivedEnd]
    RecordingProgressResult:
      type: object
      additionalProperties: false
      required: [validUntil, recordingId, incarnation, artifactId, mappingSha256, durationMs, revision, writerGeneration, positionMs, atDerivedEnd, operationId]
      properties:
        validUntil: {type: string, format: date-time, description: Original effective transaction deadline DATA; not permission or a session TTL.}
        recordingId: {type: string, minLength: 1, maxLength: 128}
        incarnation: {type: string, format: uuid}
        artifactId: {type: string, pattern: '^[a-f0-9]{32}$'}
        mappingSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        durationMs: {type: integer, format: int64, minimum: 1, maximum: 43200000}
        revision: {$ref: '#/components/schemas/RecordingProgressCounter'}
        writerGeneration: {$ref: '#/components/schemas/RecordingProgressCounter'}
        positionMs: {type: integer, format: int64, minimum: 0, maximum: 43200000}
        atDerivedEnd: {type: boolean}
        operationId: {type: string, format: uuid}
    RecordingProgressReadEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, timeline, progress]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        timeline: {$ref: '#/components/schemas/RecordingProgressTimeline'}
        progress: {$ref: '#/components/schemas/RecordingProgressSnapshot'}
    RecordingProgressWriteEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, result]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        result: {$ref: '#/components/schemas/RecordingProgressResult'}

    DerivedRecording:
      type: object
      additionalProperties: false
      required: [recordingId, state, sourceIncomplete, gapsOmitted, sourceStatus]
      properties:
        recordingId: {type: string}
        id:
          type: string
          pattern: '^[a-f0-9]{32}$'
          description: Process-local immutable output correlation, not access authority.
        state: {type: string, enum: [unknown, ready]}
        reason: {type: string}
        durationMs: {type: integer, format: int64, minimum: 1}
        bytes: {type: integer, format: int64, minimum: 1}
        sourceIncomplete: {type: boolean}
        gapsOmitted: {type: boolean}
        sourceStatus: {type: string}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        partOffsets:
          type: array
          maxItems: 256
          description: Measured recorded-media positions, not capture wall-clock continuity.
          items:
            type: object
            additionalProperties: false
            required: [partIndex, startMs, durationMs]
            properties:
              partIndex: {type: integer, minimum: 1, maximum: 256}
              startMs: {type: integer, format: int64, minimum: 0}
              durationMs: {type: integer, format: int64, minimum: 1}

    RecordingPartTiming:
      type: object
      required: [recordingId, partIndex, state]
      additionalProperties: false
      properties:
        recordingId: {type: string}
        partIndex: {type: integer, minimum: 1, maximum: 256}
        state: {type: string, enum: [unknown, container_estimate]}
        reason:
          type: string
          enum: [no_observation, ledger_changed, observation_expired, probe_unavailable, unsupported_container]
        containerDurationMs: {type: integer, format: int64, minimum: 1}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        binding:
          type: string
          description: Opaque observation identifier, never a file/access capability.
        observedBytes: {type: integer, format: int64, minimum: 1}

    SABManagedCopy:
      type: object
      additionalProperties: false
      required: [queueId, state, configured]
      properties:
        queueId: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [unknown, not_recorded, copy_recorded, reconciliation_required]}
        configured:
          type: boolean
          description: Syntactic server configuration only, never current root/file proof.
        reason: {type: string, enum: [not_configured, namespace_unobserved, configuration_changed, attempt_unconfirmed]}
        chargedBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
          description: This attempt's full logical charge, not actual occupied/free bytes.
        fileCount: {type: integer, minimum: 0, maximum: 128}
        observedAt: {type: string, format: date-time}
      oneOf:
        - required: [reason]
          properties:
            state: {enum: [unknown]}
            reason: {enum: [not_configured, namespace_unobserved, configuration_changed]}
          not:
            anyOf:
              - required: [chargedBytes]
              - required: [fileCount]
              - required: [observedAt]
        - required: [chargedBytes, fileCount]
          properties:
            state: {enum: [not_recorded]}
            configured: {enum: [true]}
            chargedBytes: {enum: [0]}
            fileCount: {enum: [0]}
          not:
            anyOf:
              - required: [reason]
              - required: [observedAt]
        - required: [chargedBytes, fileCount, observedAt]
          properties:
            state: {enum: [copy_recorded]}
            configured: {enum: [true]}
            fileCount: {minimum: 1}
          not: {required: [reason]}
        - required: [chargedBytes, fileCount, observedAt, reason]
          properties:
            state: {enum: [reconciliation_required]}
            configured: {enum: [true]}
            fileCount: {minimum: 1}
            reason: {enum: [attempt_unconfirmed]}

    SABImportPreview:
      type: object
      additionalProperties: false
      required: [queueId, state, observedAt, entryCount, observedBytes, files]
      properties:
        queueId: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [local_inventory]}
        observedAt: {type: string, format: date-time}
        entryCount: {type: integer, minimum: 1, maximum: 128}
        observedBytes: {type: integer, format: int64, minimum: 0, maximum: 1099511627776}
        files:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [ordinal, kind, extension, observedBytes]
            properties:
              ordinal: {type: integer, minimum: 1, maximum: 128}
              kind: {type: string, enum: [media_candidate, other_regular]}
              extension: {type: string, enum: [mkv, mp4, ts, m2ts, avi, nfo, srt, other]}
              observedBytes: {type: integer, format: int64, minimum: 0, maximum: 1099511627776}
    SABFallbackPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SABFallbackStatus'}
        nextCursor: {type: string, minLength: 1, maxLength: 64}
    SABFallbackStatus:
      type: object
      additionalProperties: false
      required: [queueId, state]
      properties:
        queueId: {type: integer, format: int64, minimum: 1}
        state:
          type: string
          enum: [not_submitted, submission_unknown, submitted, queued, downloading, download_completed, failed, unknown]
        reason:
          type: string
          enum: [acknowledgement_unavailable, provider_unavailable, provider_state_unknown]
        submittedAt: {type: string, format: date-time}
        checkedAt: {type: string, format: date-time}
    LocalLibraryGroups:
      type: object
      required: [groups, total, limit, offset]
      properties:
        groups:
          type: array
          items: {$ref: '#/components/schemas/LocalLibraryGroupCard'}
        total: {type: integer, minimum: 0}
        limit: {type: integer}
        offset: {type: integer}
        alphabetBuckets:
          type: array
          items: {type: string}
        originalLanguageFilterSupported:
          type: boolean
          description: True only for local cards using the full saved index. Older servers and unsupported responses omit it. An active filter response without true must not be silently treated as filtered.
    LocalLibraryGroupCard:
      type: object
      description: Existing library group shape with original group IDs and aggregate counts. Cards omit nested Items/Seasons; filtered groups retain all otherwise-visible versions in their counts. Other existing group fields remain unchanged.
      required: [id, groupType, libraryType, title, itemCount]
      properties:
        id: {type: string}
        groupType: {type: string}
        libraryType: {type: string}
        title: {type: string}
        itemCount: {type: integer, minimum: 0}
        missingCount: {type: integer, minimum: 0}
        year: {type: integer}
        overview: {type: string}
        certification: {type: string}
        certificationEvidence:
          type: array
          items: {$ref: '#/components/schemas/CertificationEvidence'}
        tmdbId: {type: integer}
        tvdbId: {type: integer}
        imdbId: {type: string}
        poster: {$ref: '#/components/schemas/Image'}
        textPoster: {$ref: '#/components/schemas/Image'}
        backdrop: {$ref: '#/components/schemas/Image'}
        textBackdrop: {$ref: '#/components/schemas/Image'}
        matchStatus: {type: string}
        confidenceMin: {type: number}
        confidenceMax: {type: number}
        totalSizeBytes: {type: integer}
        latestModifiedAt: {type: string, format: date-time}
        latestUpdatedAt: {type: string, format: date-time}
        latestCreatedAt: {type: string, format: date-time}
        items:
          type: array
          description: Existing unfiltered non-card versions.
          items: {type: object, additionalProperties: true}
        seasons:
          type: array
          description: Existing unfiltered non-card seasons.
          items: {type: object, additionalProperties: true}
    RecordingPreviewRequest:
      type: object
      additionalProperties: false
      required: [profileId, channelId, start, stop]
      properties:
        profileId:
          type: string
          minLength: 1
        channelId:
          type: string
          minLength: 1
        tvgId:
          type: string
        channelName:
          type: string
        sourceUrl:
          type: string
          description: Ignored compatibility field; the visible catalog supplies the source.
        title:
          type: string
        description:
          type: string
        start:
          type: string
          format: date-time
        stop:
          type: string
          format: date-time
        paddingBeforeSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        paddingAfterSeconds:
          type: integer
          minimum: 0
          maximum: 3600

    RecordingPlan:
      type: object
      additionalProperties: false
      required: [checkedAt, complete, recordings]
      properties:
        checkedAt:
          type: string
          format: date-time
        complete:
          type: boolean
          description: The bounded materialized-job and known-rule forecast could be resolved. Does not imply a known limit or guarantee future capacity.
        recordings:
          type: array
          items:
            $ref: '#/components/schemas/RecordingPlanItem'
        candidate:
          $ref: '#/components/schemas/RecordingPlanItem'
        ruleForecast:
          $ref: '#/components/schemas/RecordingRuleForecast'
        projectedRecordings:
          type: array
          maxItems: 2000
          description: Only the requested profile's ephemeral rule matches; these are not persisted recording jobs.
          items:
            $ref: '#/components/schemas/ProjectedRecordingPlanItem'

    RecordingRuleForecast:
      type: object
      additionalProperties: false
      required: [status, horizonStart, horizonEnd, projectedCount]
      properties:
        status:
          type: string
          enum: [not_configured, available, partial, unavailable]
        horizonStart:
          type: string
          format: date-time
        horizonEnd:
          type: string
          format: date-time
        projectedCount:
          type: integer
          minimum: 0
          maximum: 2000
          description: Number of unmaterialized matches belonging only to the requested profile.

    RecordingPlanItem:
      type: object
      additionalProperties: false
      required: [state, start, end, maxStreams, peakScheduledConnections]
      properties:
        recordingId:
          type: string
        state:
          type: string
          enum: [clear, conflict, unknown, unavailable]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        maxStreams:
          type: integer
          minimum: 0
          description: Zero means the configured capacity is unknown, not unlimited.
        peakScheduledConnections:
          type: integer
          minimum: 0
        firstConflictStart:
          type: string
          format: date-time
        firstConflictEnd:
          type: string
          format: date-time
          description: End of the first conflicting constant-demand segment, not necessarily the last conflict.

    ProjectedRecordingPlanItem:
      type: object
      additionalProperties: false
      required: [ruleId, channelName, title, state, start, end, maxStreams, peakScheduledConnections]
      properties:
        ruleId:
          type: string
        channelName:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [clear, conflict, unknown, unavailable]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        maxStreams:
          type: integer
          minimum: 0
          description: Zero means the configured capacity is unknown, not unlimited.
        peakScheduledConnections:
          type: integer
          minimum: 0
        firstConflictStart:
          type: string
          format: date-time
        firstConflictEnd:
          type: string
          format: date-time
          description: End of the first conflicting constant-demand segment, not necessarily the last conflict.

    TasteOnboardingState:
      type: object
      additionalProperties: false
      required: [status, source, titles, available, canUseHistory, mediaTypes]
      properties:
        status: {type: string, enum: [new, skipped, completed]}
        source: {type: string, enum: ['', manual, history]}
        available: {type: boolean}
        canUseHistory: {type: boolean}
        mediaTypes:
          type: array
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [movie, series]}
        titles:
          type: array
          maxItems: 40
          items: {$ref: '#/components/schemas/Title'}
    PersonalTitleRating:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: {type: string, enum: [none, like, love, dislike]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable code where one exists. Auth codes:
            `unauthorized`, `session_expired`, `account_expired`,
            `invalid_credentials`, `password_invalid`, `pin_invalid`,
            `pin_required`, `profile_locked`, `forbidden`, `master_required`,
            `profile_not_found`, `default_password`, `rate_limited`. Other
            routes use codes such as `GATEWAY_TIMEOUT`.
        message:
          type: string
          description: Human-readable guidance where one exists.
        profileId:
          type: string
          description: With `profile_locked`, the profile that needs unlocking.

    StreamLimitError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          const: STREAM_LIMIT_REACHED
        message:
          type: string
        currentStreams:
          type: integer
        maxStreams:
          type: integer
        scope:
          type: string
          description: '`global`, `profile` or `account`.'

    ExternalIDs:
      type: object
      description: Provider IDs keyed by provider (`tmdb`, `tvdb`, `imdb`, ...).
      additionalProperties:
        type: string

    # ---------------------------------------------------------------- auth

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        newPassword:
          type: string
          description: Replacement for the default master password (see 428).
        rememberMe:
          type: boolean

    LoginResponse:
      type: object
      required: [token, expiresAt, accountId, username, isMaster]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        accountId:
          type: string
        username:
          type: string
        isMaster:
          type: boolean

    ProviderCapacityReport:
      type: object
      additionalProperties: false
      required: [sourceId, state, message, limitOrigin, cached, configuredLimit, sharedConfiguredLimit, localConnections, enforcedLimit, externalUsage, localSnapshotCompletedAt]
      properties:
        sourceId: {type: string}
        state: {type: string, enum: [available, unknown, unsupported, unavailable]}
        message: {type: string}
        limitOrigin: {type: string, enum: [provider_account, unknown]}
        reportedLimit: {type: integer, minimum: 1}
        providerActiveConnections:
          type: integer
          minimum: 0
          description: Optional aggregate active_cons from an authenticated active provider response, even when the connection limit is unknown. Missing or invalid is unknown, never zero. It is not an external-app count and is not combined arithmetically with local reservations.
        checkedAt:
          type: string
          format: date-time
          description: Server completion time of the provider-response/check processing, retained on cache reads. Not the provider measurement time and not the time of the later local reservation snapshot.
        cacheExpiresAt: {type: string, format: date-time}
        cached: {type: boolean}
        configuredLimit: {type: integer, minimum: 0}
        sharedConfiguredLimit: {type: integer, minimum: 0}
        localConnections:
          type: integer
          minimum: 0
          description: Local server-process reservations, including inputs still opening or closing and shared upstream semantics. Not an atomic common sample with the provider aggregate.
        localSnapshotCompletedAt:
          type: string
          format: date-time
          description: Server completion time immediately after the local reservation/policy snapshot; resampled per response without renewing checkedAt.
        externalUsage:
          type: object
          additionalProperties: false
          required: [state, reason]
          description: External occupancy remains unknown for this producer. No measured external count, zero, range or inferred difference is provided; no extra polling or client enumeration occurs.
          properties:
            state: {type: string, enum: [unknown]}
            reason:
              type: string
              enum: [provider_count_unavailable, no_common_trusted_measurement]
        enforcedLimit: {type: integer, minimum: 0}
        automaticAdoptionEnabled:
          type: boolean
          description: Global explicit opt-in for additional limits from already checked fresh saved-provider reports; no automatic discovery or refresh.
        automaticLimit:
          type: integer
          minimum: 1
          description: Present only when a fresh checked report is actually stricter than the current manual/shared cap in the locked admission snapshot.
        automaticExpiresAt: {type: string, format: date-time}
        enforcementOrigin:
          type: string
          enum: [manual, provider_extra_cap]
          description: A fresh provider extra cap never raises a positive manual limit or stops running inputs; stale or unknown reports use existing manual policy.


    ProfileLivePermissions:
      type: object
      additionalProperties: false
      required: [allowLiveTakeover, allowRecordingInterruption]
      properties:
        allowLiveTakeover:
          type: boolean
        allowRecordingInterruption:
          type: boolean

    LiveCapacityError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [LIVE_STREAM_LIMIT_REACHED, LIVE_RECORDING_CONFIRMATION_REQUIRED, LIVE_RECORDING_CONFIRMATION_EXPIRED, LIVE_STREAM_TAKEN_OVER, LIVE_TAKEOVER_PERMISSION_CHANGED, LIVE_TAKEOVER_STOP_FAILED, LIVE_TAKEOVER_PENDING_CLOSE]
        message:
          type: string
        confirmationToken:
          type: string
          pattern: '^[a-f0-9]{48}$'
        recordingCount:
          type: integer
          minimum: 1
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 30
        retryAutomatically:
          type: boolean
          enum: [false]
        provider:
          type: string
        currentStreams:
          type: integer
        maxStreams:
          type: integer
        available:
          type: integer
        atLimit:
          type: boolean

    ParentListAddRequest:
      type: object
      nullable: true
      additionalProperties: true
      description: Existing case-insensitive url field decoding; missing or initially null selects empty and is rejected. Real decoder rejects unknown fields.
      properties:
        url: {type: string, nullable: true}
    ParentListReplaceRequest:
      type: object
      nullable: true
      additionalProperties: true
      description: Existing case-insensitive lists field decoding; missing/null clears. Real decoder rejects unknown fields.
      properties:
        lists:
          type: array
          nullable: true
          items: {type: string, nullable: true}

    ParentRatingScalarRequest:
      type: object
      nullable: true
      additionalProperties: true
      description: Case-insensitive rating field; real decoder rejects unknown fields. Missing/null initially selects empty; scalar duplicate null behavior is preserved.
      properties:
        rating: {type: string, nullable: true}
    ParentRatingPairRequest:
      type: object
      minProperties: 2
      additionalProperties: true
      description: Both final decoded movieRating/tvRating strings required, case-insensitively. Empty allowed; final null rejected. Schema allows field-name casing; real decoder rejects unknown fields.
      properties:
        movieRating: {type: string}
        tvRating: {type: string}

    ParentModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: ['', rating, content_list]
    ParentKidsFlagRequest:
      type: object
      nullable: true
      additionalProperties: true
      description: One existing bool Decode. Missing/null initially selects false; duplicate true then null retains true. Field casing is accepted. Actual API rejects unknown fields; Cookie decoder permits them, with its existing whole-body middleware boundary.
      properties:
        isKidsProfile: {type: boolean, nullable: true}
    ParentKidsFlagCookieProfile:
      type: object
      additionalProperties: true
      required: [id, name, isKidsProfile, allowLiveTakeover, allowRecordingInterruption]
      description: Partial management projection. Only these flag/Kids/rights facts are confirmed; preserve existing accountId, privacy and other unrelated fields when merging. Empty Kids strings/lists may be omitted by this serializer.
      properties:
        id: {type: string}
        name: {type: string}
        isKidsProfile: {type: boolean}
        allowLiveTakeover: {type: boolean}
        allowRecordingInterruption: {type: boolean}
        kidsMode: {type: string}
        kidsMaxRating: {type: string}
        kidsMaxMovieRating: {type: string}
        kidsMaxTVRating: {type: string}
        kidsAllowedLists:
          type: array
          items: {type: string}
    ProfileStateRecovery:
      type: object
      additionalProperties: false
      required: [profile, recovery]
      properties:
        profile:
          type: object
          additionalProperties: false
          required: [id, name, isKidsProfile, kidsMode, kidsMaxRating, kidsMaxMovieRating, kidsMaxTVRating, kidsAllowedLists, allowLiveTakeover, allowRecordingInterruption]
          properties:
            id: {type: string}
            name: {type: string}
            isKidsProfile: {type: boolean}
            allowLiveTakeover: {type: boolean}
            allowRecordingInterruption: {type: boolean}
            kidsMode: {type: string}
            kidsMaxRating: {type: string}
            kidsMaxMovieRating: {type: string}
            kidsMaxTVRating: {type: string}
            kidsAllowedLists:
              type: array
              items: {type: string}
        recovery:
          type: object
          additionalProperties: false
          required: [usersWriteBlocked, settingsPendingUncertainty]
          properties:
            usersWriteBlocked: {type: boolean}
            settingsPendingUncertainty: {type: boolean}

    ParentModeFailure:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [parent_confirmation_changed, parent_confirmation_unavailable, parent_confirmation_outcome_unknown]

    Profile:
      type: object
      required: [id, accountId, name]
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          type: string
        color:
          type: string
        iconUrl:
          type: string
        pinLength:
          type: integer
          description: PIN length, so clients can render fixed-length entry.
        hasPin:
          type: boolean
        hasIcon:
          type: boolean
          description: When true, fetch the image from `GET /api/users/{userId}/icon`.
        traktAccountId:
          type: string
        plexAccountId:
          type: string
        mdblistAccountId:
          type: string
        simklAccountId:
          type: string
        scrobAccountId:
          type: string
        isKidsProfile:
          type: boolean
        allowShareLinks:
          type: boolean
        allowLiveTakeover:
          type: boolean
          default: false
          description: Account-managed permission to stop an eligible live input in the same account.
        allowRecordingInterruption:
          type: boolean
          default: false
          description: Separate account-managed permission; every recording interruption still requires confirmation.
        activityPrivacy:
          type: string
          enum: [shared, shared_anonymous, not_shared]
        kidsMode:
          type: string
          description: '`rating`, `content_list`, or empty (disabled).'
        kidsMaxRating:
          type: string
          deprecated: true
        kidsMaxMovieRating:
          type: string
        kidsMaxTVRating:
          type: string
        kidsAllowedLists:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PinVerifyRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string

    PinVerifyResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        unlockToken:
          type: string
          description: |
            Opaque profile unlock token (prefix `pu_`). Bound to the session
            token that called verify (carried over by refresh) and to this
            profile's current PIN. Absent only on servers that predate
            server-side unlocks.
        expiresAt:
          type: string
          format: date-time
          description: When `unlockToken` stops working (UTC). Re-verify the PIN after this.

    LogoutResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: logged out

    VersionResponse:
      type: object
      required: [version]
      properties:
        version:
          type: string
        buildId:
          type: string

    # ---------------------------------------------------------------- titles

    Image:
      type: object
      required: [url]
      description: Artwork. Note the flag fields are snake_case, unlike the rest of the API.
      properties:
        url:
          type: string
        type:
          type: string
          description: '`poster`, `backdrop` or `logo`.'
        width:
          type: integer
        height:
          type: integer
        is_dark:
          type: boolean
        is_textless:
          type: boolean
        language:
          type: string
        is_fallback_language:
          type: boolean

    Trailer:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        site:
          type: string
        type:
          type: string
        url:
          type: string
        embedUrl:
          type: string
        thumbnailUrl:
          type: string
        language:
          type: string
        country:
          type: string
        key:
          type: string
        official:
          type: boolean
        publishedAt:
          type: string
        resolution:
          type: integer
        source:
          type: string
        durationSeconds:
          type: integer
        seasonNumber:
          type: integer
          description: 0 = series-level trailer.

    TrailerResponse:
      type: object
      required: [trailers]
      properties:
        primaryTrailer:
          $ref: '#/components/schemas/Trailer'
        trailers:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Trailer'

    Rating:
      type: object
      required: [source, value, max]
      properties:
        source:
          type: string
          description: '`imdb`, `tmdb`, `trakt`, `letterboxd`, `tomatoes`, `audience`, `metacritic`, ...'
        value:
          type: number
        max:
          type: number
          description: Scale maximum (10 for IMDb, 100 for Rotten Tomatoes, ...).

    Release:
      type: object
      required: [type, date]
      properties:
        type:
          type: string
          description: '`theatrical`, `theatricalLimited`, `digital`, `physical`, `premiere` or `tv`.'
        date:
          type: string
          description: ISO 8601 date or date-time.
        country:
          type: string
        note:
          type: string
        source:
          type: string
        primary:
          type: boolean
        released:
          type: boolean

    CastMember:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        character:
          type: string
        order:
          type: integer
        profilePath:
          type: string
        profileUrl:
          type: string

    Credits:
      type: object
      properties:
        cast:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/CastMember'

    Collection:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        poster:
          $ref: '#/components/schemas/Image'
        backdrop:
          $ref: '#/components/schemas/Image'

    EpisodeNumbering:
      type: object
      required: [seriesId]
      description: Which series and episode ordering a season/episode pair is numbered under.
      properties:
        seriesId:
          type: string
        ordering:
          type: string

    Availability:
      type: string
      description: |
        Release badge state, derived when the response is encoded:
        `released` (watchable at home / a series has aired), `theatrical`
        (in theaters only), `coming_soon` (`releaseDate` within 30 days) or
        `unreleased`.
      enum: [released, theatrical, coming_soon, unreleased]

    LocalMediaCertificationProjection:
      type: object
      additionalProperties: true
      description: Existing local media group projection. Other library fields are unchanged; the additive provider evidence is explicitly described here.
      required: [id, title]
      properties:
        id: {type: string}
        title: {type: string}
        certification: {type: string}
        certificationEvidence:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/CertificationEvidence'}
    CertificationEvidence:
      type: object
      additionalProperties: false
      required: [country, value, source, sourceType, sourceTitleId, scope, retrievedAt]
      properties:
        country: {type: string, pattern: '^[A-Z]{2}$'}
        value: {type: string, minLength: 1, maxLength: 64}
        source: {type: string, enum: [tmdb]}
        sourceType: {type: string, enum: [metadata]}
        sourceTitleId: {type: string, pattern: '^tmdb:(movie|series):[1-9][0-9]*$'}
        scope: {type: string, enum: [movie_release, series]}
        retrievedAt: {type: string, format: date-time}
        expiresAt:
          type: string
          format: date-time
          description: Conservative source cache expiry when available. Missing expiry must remain unknown to any future authorizer. Copying cached evidence does not renew it.
        releaseType: {type: integer, minimum: 1, maximum: 6}
        releaseDate: {type: string, maxLength: 40}
        language: {type: string, maxLength: 16}
        note: {type: string, maxLength: 512}

    ReminderEpisode:
      type: object
      additionalProperties: false
      required: [episodeId, numbering, seasonNumber, episodeNumber]
      properties:
        episodeId: {type: string, minLength: 1, maxLength: 256}
        numbering:
          type: object
          additionalProperties: false
          required: [seriesId]
          properties:
            seriesId: {type: string, minLength: 1, maxLength: 128}
            ordering: {type: string, enum: [official]}
        seasonNumber: {type: integer, minimum: 0, maximum: 10000}
        episodeNumber: {type: integer, minimum: 1, maximum: 100000}
    ReminderCreate:
      type: object
      additionalProperties: false
      required: [contentId, contentType, eventKind]
      properties:
        contentId: {type: string, minLength: 1, maxLength: 128}
        contentType: {type: string, enum: [movie, series]}
        eventKind: {type: string, enum: [release, new_episode, matching_source]}
        releaseType: {type: string, enum: [digital, physical, theatrical]}
        episode: {$ref: '#/components/schemas/ReminderEpisode'}
    Reminder:
      type: object
      additionalProperties: false
      required: [id, contentId, contentType, eventKind, title, state, createdAt, createdOnCurrentDevice]
      properties:
        id: {type: string}
        contentId: {type: string}
        contentType: {type: string, enum: [movie, series]}
        eventKind: {type: string, enum: [release, new_episode, matching_source]}
        title: {$ref: '#/components/schemas/Title'}
        releaseType: {type: string, enum: [digital, physical, theatrical]}
        episode: {$ref: '#/components/schemas/ReminderEpisode'}
        state: {type: string, enum: [waiting, triggered]}
        createdOnCurrentDevice: {type: boolean, description: Matching-source interest belongs to this creating client; metadata interests are profile-wide.}
        createdAt: {type: string, format: date-time}
        lastObservedAt: {type: string, format: date-time}
    ReminderList:
      type: object
      required: [remindersSupported, monitoring, items]
      properties:
        remindersSupported: {type: boolean, enum: [true]}
        monitoring: {type: string, enum: [observations_only]}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Reminder'}}
    ReminderEvent:
      type: object
      additionalProperties: false
      required: [id, reminderId, eventKind, contentId, contentType, title, occurredAt, candidateOnly]
      properties:
        id: {type: string}
        reminderId: {type: string}
        eventKind: {type: string, enum: [release, new_episode, matching_source]}
        contentId: {type: string}
        contentType: {type: string, enum: [movie, series]}
        title: {$ref: '#/components/schemas/Title'}
        episode: {$ref: '#/components/schemas/ReminderEpisode'}
        releaseType: {type: string, enum: [digital, physical, theatrical]}
        occurredAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time}
        dismissedAt: {type: string, format: date-time}
        candidateOnly: {type: boolean, description: True only for a source candidate; no event guarantees playback.}
    ReminderError:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code:
          type: string
          enum: [reminder_invalid_request, reminder_metadata_reload_required, reminder_interest_limit, reminder_not_found, reminder_profile_unavailable, reminder_storage_unavailable]
    SourceAvailability:
      type: object
      required: [state, complete]
      properties:
        episodeCoverage:
          $ref: '#/components/schemas/EpisodeSourceCoverage'
        sourceType: {type: string, enum: [local], description: Locally checked file and requested audio; not a playback guarantee}
        state:
          type: string
          enum: [unknown, found, not_found]
          description: Filtered source candidates, not a guarantee of playable media. A series status does not prove availability of each episode.
        checkedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        providers:
          type: array
          items:
            type: string
        complete:
          type: boolean
          description: All explicitly selected indexers completed this bounded search.
        reason:
          type: string
    EpisodeSourceCoverage:
      type: object
      additionalProperties: false
      description: Current observed episode coordinates only. Neither counts nor a general series candidate describe a complete catalogue. Partial requires both found and missing episodes; found-only or found-plus-unknown remains unknown coverage.
      required: [state, foundEpisodes, notFoundEpisodes, unknownEpisodes, catalogueComplete, seasons]
      properties:
        state: {type: string, enum: [unknown, partial]}
        foundEpisodes: {type: integer, minimum: 0, maximum: 1012}
        notFoundEpisodes: {type: integer, minimum: 0, maximum: 1012}
        unknownEpisodes: {type: integer, minimum: 0, maximum: 1012}
        catalogueComplete: {type: boolean, enum: [false]}
        seasons:
          type: array
          maxItems: 1012
          items:
            type: object
            additionalProperties: false
            required: [seasonNumber, state, foundEpisodes, notFoundEpisodes, unknownEpisodes]
            properties:
              seasonNumber: {type: integer, minimum: 0, maximum: 10000}
              state: {type: string, enum: [unknown, partial]}
              foundEpisodes: {type: integer, minimum: 0, maximum: 1012}
              notFoundEpisodes: {type: integer, minimum: 0, maximum: 1012}
              unknownEpisodes: {type: integer, minimum: 0, maximum: 1012}
    Title:
      type: object
      required: [id, name, mediaType]
      properties:
        originalLanguageEvidence:
          $ref: '#/components/schemas/OriginalLanguageEvidence'
        personalRating:
          type: string
          enum: [like, love, dislike]
          description: Optional profile preference. Omission does not prove that ratings were loaded; use the rating endpoint for an authoritative state.
        sourceAvailability:
          $ref: '#/components/schemas/SourceAvailability'
        id:
          type: string
        name:
          type: string
        originalName:
          type: string
        alternateTitles:
          type: array
          items:
            type: string
        overview:
          type: string
        year:
          type: integer
        language:
          type: string
        countryCode:
          type: string
        poster:
          $ref: '#/components/schemas/Image'
        textPoster:
          $ref: '#/components/schemas/Image'
        posters:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        backdrop:
          $ref: '#/components/schemas/Image'
        textBackdrop:
          $ref: '#/components/schemas/Image'
        backdrops:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        logo:
          $ref: '#/components/schemas/Image'
        mediaType:
          type: string
          description: '`movie`, `series`, or `person` (search cards only).'
        tvdbId:
          type: integer
          format: int64
        imdbId:
          type: string
        tmdbId:
          type: integer
          format: int64
        popularity:
          type: number
        voteCount:
          type: integer
        network:
          type: string
        airsTime:
          type: string
          description: Local air time from TVDB, for example `21:00`.
        airsTimezone:
          type: string
          description: IANA time zone.
        status:
          type: string
          description: Coarse release status (movies `released`/`theatrical`/`upcoming`/`unknown`; series `released`/`unreleased`). Prefer `availability`.
        lifecycleStatus:
          type: string
          description: Series lifecycle from the provider (`Continuing`, `Ended`, ...).
        isDaily:
          type: boolean
        certification:
          type: string
          description: Legacy display/filtering value. This unqualified string is not regional certification evidence.
        certificationEvidence:
          type: array
          maxItems: 256
          description: Raw regional provider metadata only; no official registry verification or playback authorization. Movie release rows do not identify the played edition; series metadata establishes no episode classification. Old caches may omit this field.
          items:
            $ref: '#/components/schemas/CertificationEvidence'
        primaryTrailer:
          $ref: '#/components/schemas/Trailer'
        trailers:
          type: array
          items:
            $ref: '#/components/schemas/Trailer'
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
        theatricalRelease:
          $ref: '#/components/schemas/Release'
        homeRelease:
          $ref: '#/components/schemas/Release'
        releaseDate:
          type: string
          format: date
          description: First watchable date, `YYYY-MM-DD` (movie earliest theatrical/home window; series premiere).
        availability:
          $ref: '#/components/schemas/Availability'
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        credits:
          $ref: '#/components/schemas/Credits'
        runtimeMinutes:
          type: integer
          description: Minutes (movies).
        collection:
          $ref: '#/components/schemas/Collection'
        genres:
          type: array
          items:
            type: string
        adult:
          type: boolean
        watchState:
          type: string
          enum: [none, partial, complete]
        unwatchedCount:
          type: integer
          description: Series only; released episodes minus watched.
        cardSubtitle:
          type: string
        cardImage:
          $ref: '#/components/schemas/Image'
        forceTitleOverlay:
          type: boolean

    SearchResult:
      type: object
      required: [title, score]
      properties:
        title:
          $ref: '#/components/schemas/Title'
        score:
          type: integer

    TrendingItem:
      type: object
      required: [rank, title]
      properties:
        rank:
          type: integer
        title:
          $ref: '#/components/schemas/Title'

    Resume:
      type: object
      required: [position, duration, percent, eligible]
      description: |
        Server-computed resume decision. Offer "Resume" only when `eligible`.
        When only a percentage is known (for example a Trakt import),
        `position` and `duration` are 0: seek to `percent` of the media
        duration once it is known.
      properties:
        position:
          type: number
          description: Seconds.
        duration:
          type: number
          description: Seconds.
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: 0–100.
        eligible:
          type: boolean

    Episode:
      type: object
      required: [id, name, seasonNumber, episodeNumber]
      properties:
        numbering:
          $ref: '#/components/schemas/EpisodeNumbering'
        id:
          type: string
        tmdbId:
          type: integer
          format: int64
        tmdbSeasonNumber:
          type: integer
        tmdbEpisodeNumber:
          type: integer
        tvdbId:
          type: integer
          format: int64
        name:
          type: string
        overview:
          type: string
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        absoluteEpisodeNumber:
          type: integer
          description: Release absolute number; excludes season-zero specials.
        airedDate:
          type: string
        airedDateTimeUTC:
          type: string
        runtimeMinutes:
          type: integer
        image:
          $ref: '#/components/schemas/Image'
        itemId:
          type: string
          description: Canonical progress/watch item ID (details-bundle only). Use verbatim.
        watched:
          type: boolean
          description: Watched per history (details-bundle only).
        resume:
          $ref: '#/components/schemas/Resume'

    Season:
      type: object
      required: [id, name, number, episodes]
      properties:
        id:
          type: string
        tvdbId:
          type: integer
          format: int64
        name:
          type: string
        number:
          type: integer
        overview:
          type: string
        type:
          type: string
        image:
          $ref: '#/components/schemas/Image'
        episodeCount:
          type: integer
        episodes:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Episode'

    SeriesOrdering:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
        name:
          type: string
        seasonCount:
          type: integer
        isOfficial:
          type: boolean

    SeriesDetails:
      type: object
      required: [title, seasons]
      properties:
        numbering:
          $ref: '#/components/schemas/EpisodeNumbering'
        title:
          $ref: '#/components/schemas/Title'
        seasons:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Season'
        preferredSeason:
          type: integer
        episodeTmdbEnriched:
          type: boolean
        availableOrderings:
          type: array
          description: Present only when more than one ordering exists.
          items:
            $ref: '#/components/schemas/SeriesOrdering'
        activeOrdering:
          type: string

    ContentPreferenceResponse:
      type: object
      required: [localSourcePreferenceSupported]
      properties:
        localSourcePreferenceSupported:
          type: boolean
          enum: [true]
        contentId:
          type: string
        contentType:
          type: string
        audioLanguage:
          type: string
        subtitleLanguage:
          type: string
        subtitleMode:
          type: string
        preferLocalFiles:
          type: [boolean, 'null']
        updatedAt:
          type: string
          format: date-time

    ContentPreference:
      type: object
      required: [contentId, contentType]
      properties:
        contentId:
          type: string
        contentType:
          type: string
          enum: [series, movie]
        preferLocalFiles:
          type: [boolean, 'null']
          description: |
            Nullable source ordering override. True prefers an eligible local
            file; false keeps normal search-first selection with local fallback.
            Null inherits. Omitted fields retain their saved value on update.
            Scoped series IDs use <series>:season:<n>[:episode:<n>] and override
            episode, season, series, then profile/server in that order.
        audioLanguage:
          type: string
          description: ISO 639-2 code.
        subtitleLanguage:
          type: string
        subtitleMode:
          type: string
          enum: ['off', 'on', forced-only]
        updatedAt:
          type: string
          format: date-time

    DetailsBundle:
      type: object
      required: [seriesDetails, movieDetails, similar, trailers, contentPreference, watchState, playbackProgress]
      properties:
        seriesDetails:
          anyOf:
            - $ref: '#/components/schemas/SeriesDetails'
            - type: 'null'
        movieDetails:
          anyOf:
            - $ref: '#/components/schemas/Title'
            - type: 'null'
        similar:
          type: array
          items:
            $ref: '#/components/schemas/Title'
        trailers:
          anyOf:
            - $ref: '#/components/schemas/TrailerResponse'
            - type: 'null'
        contentPreference:
          anyOf:
            - $ref: '#/components/schemas/ContentPreference'
            - type: 'null'
        watchState:
          anyOf:
            - $ref: '#/components/schemas/SeriesWatchState'
            - type: 'null'
        playbackProgress:
          type: array
          description: Progress rows for this title only.
          items:
            $ref: '#/components/schemas/PlaybackProgress'
        upNextEpisode:
          $ref: '#/components/schemas/EpisodeReference'
        resume:
          $ref: '#/components/schemas/Resume'
        inWatchlist:
          type: boolean
          description: |
            Whether the title is on the profile's watchlist, matched across
            TMDB / TVDB / IMDB ID forms. Absent on older servers.
        watched:
          type: boolean
          description: |
            Movies only: whether the movie is marked watched, matched across
            ID forms (series carry per-episode `watched`). Absent on older servers.

    # ---------------------------------------------------------------- history

    EpisodeReference:
      type: object
      required: [seasonNumber, episodeNumber]
      properties:
        numbering:
          $ref: '#/components/schemas/EpisodeNumbering'
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        absoluteEpisodeNumber:
          type: integer
        episodeId:
          type: string
        tvdbId:
          type: string
        title:
          type: string
        overview:
          type: string
        runtimeMinutes:
          type: integer
        airDate:
          type: string
        airDateTimeUTC:
          type: string
        airTimeEstimated:
          type: boolean
        image:
          $ref: '#/components/schemas/Image'
        watchedAt:
          type: string
          format: date-time
          description: '`0001-01-01T00:00:00Z` when unknown.'
        itemId:
          type: string
          description: Canonical progress/watch item ID for this episode. Use verbatim; never build `…:sNNeNN` yourself.

    SeriesWatchState:
      type: object
      required: [seriesId, seriesTitle, updatedAt, lastWatched]
      description: A Continue Watching row or a series' watch state. Movies use the same shape without `nextEpisode`.
      properties:
        seriesId:
          type: string
        seriesTitle:
          type: string
        overview:
          type: string
        posterUrl:
          type: string
        textPosterUrl:
          type: string
        backdropUrl:
          type: string
        textBackdropUrl:
          type: string
        logoUrl:
          type: string
          description: Title logo (transparent wordmark) for the hero, when the metadata has one.
        backdropUrls:
          type: array
          items:
            type: string
        year:
          type: integer
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        updatedAt:
          type: string
          format: date-time
        lastWatched:
          $ref: '#/components/schemas/EpisodeReference'
        nextEpisode:
          $ref: '#/components/schemas/EpisodeReference'
        watchedEpisodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EpisodeReference'
        percentWatched:
          type: number
          description: 0–100. Prefer `resume`.
        resumePercent:
          type: number
          description: 0–100. Prefer `resume`.
        resume:
          $ref: '#/components/schemas/Resume'
        watchedEpisodeCount:
          type: integer
        totalEpisodeCount:
          type: integer
        prequeueId:
          type: string
        prequeueStatus:
          $ref: '#/components/schemas/PrequeueStatus'
        status:
          type: string
        lifecycleStatus:
          type: string
        theatricalRelease:
          $ref: '#/components/schemas/Release'
        homeRelease:
          $ref: '#/components/schemas/Release'

    PlaybackProgressUpdate:
      type: object
      additionalProperties: false
      required: [mediaType]
      description: |
        Player heartbeat. Strict: the server rejects unknown fields. Address
        the item with `itemId`, or for episodes with `seriesId` +
        `seasonNumber` + `episodeNumber`.
      properties:
        mediaType:
          type: string
          enum: [movie, episode, live]
        itemId:
          type: string
        position:
          type: number
          description: Seconds.
        duration:
          type: number
          description: Seconds.
        percentWatched:
          type: number
          minimum: 0
          maximum: 100
          description: 0–100. Only needed when the duration is unknown; otherwise derived from position/duration.
        timestamp:
          type: string
          format: date-time
        isPaused:
          type: boolean
        isBuffering:
          type: boolean
        playbackEnded:
          type: boolean
          description: True on the final heartbeat of a playback session.
        bufferAheadSeconds:
          type: number
          description: Seconds of playable buffer ahead of the playhead.
        requiredBandwidthMbps:
          type: number
          description: Estimated average bitrate of the active release, Mbps.
        sourcePath:
          type: string
          description: The active stream path.
        posterUrl:
          type: string
        notificationImageUrl:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        seriesId:
          type: string
        seriesName:
          type: string
        episodeName:
          type: string
        movieName:
          type: string
        year:
          type: integer

    PlaybackProgress:
      type: object
      required: [id, mediaType, itemId, position, duration, percentWatched, updatedAt]
      properties:
        id:
          type: string
          description: '`mediaType:itemId`.'
        mediaType:
          type: string
          enum: [movie, episode, live]
        itemId:
          type: string
        position:
          type: number
          description: Seconds.
        duration:
          type: number
          description: Seconds.
        percentWatched:
          type: number
          description: 0–100.
        updatedAt:
          type: string
          format: date-time
        isPaused:
          type: boolean
        isBuffering:
          type: boolean
        watchedSeconds:
          type: number
          description: Accumulated actual playback time, seconds.
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        seriesId:
          type: string
        seriesName:
          type: string
        episodeName:
          type: string
        movieName:
          type: string
        year:
          type: integer
        hiddenFromContinueWatching:
          type: boolean
        resume:
          $ref: '#/components/schemas/Resume'
        allowedToContinue:
          type: boolean
          description: Heartbeat responses only. False when the server wants playback stopped (for example a stream limit).
        migrationRequested:
          type: boolean
          description: Heartbeat responses only (stream migration; deferred for native clients).
        migrationReason:
          type: string
        migrationPreparationRequested:
          type: boolean
        migrationPreparationReason:
          type: string

    WatchHistoryItem:
      type: object
      required: [id, mediaType, itemId, name, watched]
      properties:
        id:
          type: string
        mediaType:
          type: string
          enum: [movie, series, episode, live]
        itemId:
          type: string
        name:
          type: string
        year:
          type: integer
        watched:
          type: boolean
        watchedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        watchedSeconds:
          type: number
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        seriesId:
          type: string
        seriesName:
          type: string

    WatchHistoryUpdate:
      type: object
      required: [mediaType]
      properties:
        mediaType:
          type: string
          enum: [movie, series, episode]
        itemId:
          type: string
          description: Optional for episodes addressed by `seriesId` + `seasonNumber` + `episodeNumber`.
        name:
          type: string
        year:
          type: integer
        watched:
          type: boolean
          description: Omitted means watched.
        watchedAt:
          type: string
          format: date-time
        watchedSeconds:
          type: number
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        seriesId:
          type: string
        seriesName:
          type: string

    WatchStatusProjection:
      type: object
      required: [mediaType, itemId, watched]
      properties:
        mediaType:
          type: string
        itemId:
          type: string
        watched:
          type: boolean

    WatchStatusKeys:
      type: object
      required: [watched]
      properties:
        watched:
          type: array
          items:
            type: string

    # ---------------------------------------------------------------- lists

    WatchlistItem:
      type: object
      required: [id, mediaType, name, addedAt]
      properties:
        sourceAvailability:
          $ref: '#/components/schemas/SourceAvailability'
        cardSubtitle:
          type: string
        forceTitleOverlay:
          type: boolean
        id:
          type: string
        mediaType:
          type: string
          enum: [movie, series]
        name:
          type: string
        overview:
          type: string
        year:
          type: integer
        posterUrl:
          type: string
        textPosterUrl:
          type: string
        backdropUrl:
          type: string
        textBackdropUrl:
          type: string
        backdropUrls:
          type: array
          items:
            type: string
        addedAt:
          type: string
          format: date-time
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        genres:
          type: array
          items:
            type: string
        runtimeMinutes:
          type: integer
        syncSource:
          type: string
        syncedAt:
          type: string
          format: date-time
        watchState:
          type: string
          enum: [none, partial, complete]
        unwatchedCount:
          type: integer
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        status:
          type: string
        lifecycleStatus:
          type: string
        theatricalRelease:
          $ref: '#/components/schemas/Release'
        homeRelease:
          $ref: '#/components/schemas/Release'
        releaseDate:
          type: string
          format: date
        availability:
          $ref: '#/components/schemas/Availability'

    WatchlistUpsert:
      type: object
      additionalProperties: false
      required: [id, mediaType, name]
      description: Strict; the server rejects unknown fields.
      properties:
        id:
          type: string
        mediaType:
          type: string
          enum: [movie, series]
        name:
          type: string
        overview:
          type: string
        year:
          type: integer
        posterUrl:
          type: string
        textPosterUrl:
          type: string
        backdropUrl:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        genres:
          type: array
          items:
            type: string
        runtimeMinutes:
          type: integer
        status:
          type: string
        lifecycleStatus:
          type: string
        syncSource:
          type: string
        syncedAt:
          type: string
          format: date-time

    HiddenItem:
      type: object
      required: [id, mediaType, hiddenAt]
      properties:
        id: {type: string}
        mediaType: {type: string}
        name: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        backdropUrl: {type: string}
        externalIds:
          $ref: '#/components/schemas/ExternalIDs'
        hiddenAt: {type: string, format: date-time}

    LovedStoredItem:
      type: object
      required: [rank, title, updatedAt]
      additionalProperties: false
      properties:
        rank: {type: integer, minimum: 1}
        title:
          $ref: '#/components/schemas/Title'
        updatedAt:
          type: string
          format: date-time
          description: Original saved preference update time; never the browse observation time.

    CachedContinueWatchingEpisode:
      type: object
      additionalProperties: false
      required: [seasonNumber, episodeNumber]
      properties:
        numbering:
          $ref: '#/components/schemas/EpisodeNumbering'
        seasonNumber: {type: integer, minimum: 0}
        episodeNumber: {type: integer, minimum: 1}
        absoluteEpisodeNumber: {type: integer, minimum: 0}
        episodeId: {type: string}
        itemId: {type: string, description: Existing server-built progress/history target; never assemble or rebind it.}
        tvdbId: {type: string}
        title: {type: string}
        airDate: {type: string}
        airDateTimeUTC: {type: string}

    CachedContinueWatchingItem:
      type: object
      additionalProperties: false
      required: [seriesId, seriesTitle, mediaType, updatedAt]
      properties:
        seriesId: {type: string}
        seriesTitle: {type: string}
        mediaType: {type: string, enum: [movie, series]}
        year: {type: integer, minimum: 0, maximum: 9999}
        externalIds:
          type: object
          additionalProperties: false
          properties:
            tmdb: {type: string}
            tvdb: {type: string}
            imdb: {type: string}
        updatedAt: {type: string, format: date-time}
        nextEpisode:
          $ref: '#/components/schemas/CachedContinueWatchingEpisode'
        lastWatched:
          $ref: '#/components/schemas/CachedContinueWatchingEpisode'
        resume:
          $ref: '#/components/schemas/Resume'
        percentWatched: {type: number, minimum: 0, maximum: 100}
        resumePercent: {type: number, minimum: 0, maximum: 100}

    DisplayListResponse:
      type: object
      required: [source, items, total]
      properties:
        originalLanguageFilterSupported:
          type: boolean
          readOnly: true
          description: True only for normalized stored watchlist, custom-list, permanent-prequeue, hidden, loved-stored and explicit collection-cached / similar-cached / tmdb-public-list-cached / tmdb-person-credits-cached / continue-watching-cached / recently-watched-cached / popular-on-server-cached sources. On these sources total is the effective filtered count before pagination; sourceTotal or unfilteredTotal must not drive paging.
        personCredits:
          type: object
          description: Present only for tmdb-person-credits-cached. Unique title membership of one finite normal cast array; not full filmography, credit/role counts, renewal or an access grant.
          additionalProperties: false
          required: [personId, sourceType, metadataLanguage, observedAt, expiresAt, scope]
          properties:
            personId: {type: integer, format: int64, minimum: 1}
            sourceType: {type: string, enum: [person-credits]}
            metadataLanguage: {type: string}
            observedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            scope: {type: string, enum: [returned-cast-titles]}
        publicList:
          type: object
          description: Present only for tmdb-public-list-cached. Finite item array observed in the normal global-key public-list operation, not upstream completeness, a verified provider visibility flag or an access grant.
          additionalProperties: false
          required: [listId, metadataLanguage, observedAt, expiresAt, scope]
          properties:
            listId: {type: integer, format: int64, minimum: 1}
            metadataLanguage: {type: string}
            observedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            scope: {type: string, enum: [returned-items]}
        similar:
          type: object
          description: Present only for similar-cached. A finite normal returned result set, not the full upstream catalogue, a renewal or an immutable cross-request grant.
          additionalProperties: false
          required: [tmdbId, mediaType, metadataLanguage, observedAt, expiresAt, scope]
          properties:
            tmdbId: {type: integer, format: int64, minimum: 1}
            mediaType: {type: string, enum: [movie, series]}
            metadataLanguage: {type: string}
            observedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            scope: {type: string, enum: [returned-results]}
        pool:
          type: object
          description: Present only for continue-watching-cached. Original complete feed observation; not a language-view snapshot or grant.
          additionalProperties: false
          required: [id, observedAt, expiresAt, complete]
          properties:
            id: {type: string, pattern: '^[0-9a-f]{32}$'}
            observedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            complete: {type: boolean, enum: [true]}
        collection:
          type: object
          description: Present only for collection-cached. Original provider observation without renewal or immutable-page guarantee.
          required: [id, name, metadataLanguage, observedAt, expiresAt]
          properties:
            id: {type: integer, format: int64, minimum: 1}
            name: {type: string}
            metadataLanguage: {type: string}
            observedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
        source:
          type: string
          description: Canonical source name actually served.
        listId:
          type: string
        items:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/WatchlistItem'
              - $ref: '#/components/schemas/TrendingItem'
              - $ref: '#/components/schemas/SeriesWatchState'
              - $ref: '#/components/schemas/CachedContinueWatchingItem'
              - $ref: '#/components/schemas/HiddenItem'
              - $ref: '#/components/schemas/LovedStoredItem'
              - $ref: '#/components/schemas/Title'
        total:
          type: integer
          description: Total matching items before paging.
        unfilteredTotal:
          type: integer
        sourceTotal:
          type: integer
        genres:
          type: array
          description: Genre facets for the filter UI.
          items:
            type: string
        alphabetBuckets:
          type: array
          items:
            type: string
        metadataPending:
          type: boolean
          description: Artwork is still being prepared; refetch later for full cards.

    # ---------------------------------------------------------------- sources

    SourceHealth:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: |
            `healthy`/`cached` (green), `unhealthy`/`not_cached` (red),
            `unknown` (no badge), `pending` (spinner; poll with `token`).
          enum: [healthy, unhealthy, cached, not_cached, pending, unknown]
        checkedAt:
          type: string
          format: date-time
        token:
          type: string
          description: Poll token for `pending` results.
        provider:
          type: string
        status:
          type: string
          description: Raw checker status.
        error:
          type: string

    ScoreBreakdownItem:
      type: object
      required: [criterion, points, rankValue, reason]
      properties:
        criterion:
          type: string
        points:
          type: integer
        rankValue:
          type: integer
          format: int64
        reason:
          type: string

    IndexerResult:
      type: object
      required: [title, indexer, guid, link, downloadUrl, sizeBytes, publishDate]
      description: A playable source. Scoring fields appear only with `includeFiltered=true`.
      properties:
        mediaEvidence:
          $ref: '#/components/schemas/MediaEvidence'
        title:
          type: string
        indexer:
          type: string
        guid:
          type: string
        link:
          type: string
        downloadUrl:
          type: string
        sizeBytes:
          type: integer
          format: int64
          description: Bytes. For packs this is the pack total unless `sizePerFile`.
        publishDate:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: string
        attributes:
          type: object
          description: Parsed release attributes (`resolution`, `hdr`, `codec`, `infoHash`, `profileId`, ...).
          additionalProperties:
            type: string
        serviceType:
          type: string
          enum: [usenet, debrid, local, plex, jellyfin]
        episodeCount:
          type: integer
          description: Episodes in a pack; 0 when not a pack.
        sizePerFile:
          type: boolean
        filterStatus:
          type: string
          enum: [passed, filtered]
        filterReason:
          type: string
        totalScore:
          type: integer
        scoreBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ScoreBreakdownItem'
        sourceHealth:
          $ref: '#/components/schemas/SourceHealth'

    AdaptiveSearchSummary:
      type: object
      properties:
        enabled:
          type: boolean
        measuredMbps:
          type: number
        measuredAt:
          type: integer
          format: int64
        maxSizeGB:
          type: number
        filteredCount:
          type: integer
        bypassed:
          type: boolean

    IndexerSearchEnvelope:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/IndexerResult'
        adaptive:
          anyOf:
            - $ref: '#/components/schemas/AdaptiveSearchSummary'
            - type: 'null'
        sourceHealthToken:
          type: string

    IndexedSourceHealth:
      type: object
      required: [index, health]
      properties:
        index:
          type: integer
          description: Position of the result in the original search response.
        health:
          $ref: '#/components/schemas/SourceHealth'

    SourceHealthSnapshot:
      type: object
      required: [token, complete, results]
      properties:
        token:
          type: string
        complete:
          type: boolean
        results:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/IndexedSourceHealth'

    # ---------------------------------------------------------------- playback

    PrequeueStatus:
      type: string
      enum: [queued, searching, resolving, probing, ready, failed, expired]

    PrequeueRequest:
      type: object
      additionalProperties: false
      required: [titleId, titleName, userId]
      description: Strict; the server rejects unknown fields.
      properties:
        automaticLibrarySelection:
          type: boolean
          default: false
          description: Opt in to validated automatic local, Plex and Jellyfin selection through the same preparation lifecycle. Omission preserves legacy selection.
        numbering:
          $ref: '#/components/schemas/EpisodeNumbering'
        titleId:
          type: string
        titleName:
          type: string
        mediaType:
          type: string
          description: '`movie` (default) or `series`.'
        userId:
          type: string
          description: Profile ID.
        clientId:
          type: string
          description: Falls back to `X-Client-ID`.
        imdbId:
          type: string
        tmdbId:
          type: string
        tvdbId:
          type: string
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeId:
          type: string
          description: Optional exact metadata episode leaf ID, distinct from a watch-progress item ID. Current server metadata must confirm the tuple before automatic library adoption.
        absoluteEpisodeNumber:
          type: integer
        startOffset:
          type: number
          description: Resume position in seconds.
        reason:
          type: string
          description: '`details` (default), `next_episode`, or `manual` (kept until removed).'
        skipHLS:
          type: boolean
          description: Native clients set this to skip HLS session creation.

    PrequeueResponse:
      type: object
      required: [prequeueId, status]
      properties:
        prequeueId:
          type: string
        targetEpisode:
          $ref: '#/components/schemas/EpisodeReference'
        status:
          $ref: '#/components/schemas/PrequeueStatus'

    AudioTrackInfo:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          description: Container (ffprobe) stream index.
        language:
          type: string
        codec:
          type: string
        profile:
          type: string
        title:
          type: string

    SubtitleTrackInfo:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          description: Container (ffprobe) stream index on prequeue status (same number as `absoluteIndex`).
        absoluteIndex:
          type: integer
        language:
          type: string
        title:
          type: string
        codec:
          type: string
        forced:
          type: boolean
        isBitmap:
          type: boolean
        bitmapType:
          type: string

    SubtitleSessionInfo:
      type: object
      required: [sessionId, vttUrl, trackIndex]
      properties:
        sessionId:
          type: string
        vttUrl:
          type: string
        subtitleUrl:
          type: string
        format:
          type: string
        trackIndex:
          type: integer
        language:
          type: string
        title:
          type: string
        codec:
          type: string
        isForced:
          type: boolean
        isExtracting:
          type: boolean
        firstCueTime:
          type: number
          description: Seconds.

    DolbyVisionConfiguration:
      type: object
      properties:
        streamIndex:
          type: integer
        pixelFormat:
          type: string
        versionMajor:
          type: integer
        versionMinor:
          type: integer
        profile:
          type: integer
        level:
          type: integer
        rpuPresentFlag:
          type: integer
        elPresentFlag:
          type: integer
        blPresentFlag:
          type: integer
        blSignalCompatibilityId:
          type: integer

    Track:
      type: object
      required: [streamIndex, typeIndex]
      description: |
        One container track the server chose. Map onto a player's track list
        by `typeIndex`, falling back to `languageCode` + `languageIndex`, then
        `codec`/`title`/`forced` as tie-breakers.
      properties:
        streamIndex:
          type: integer
          description: Container (ffprobe) stream number; the number space of HLS `audioTrack`/`subtitleTrack` params. Not a list position.
        typeIndex:
          type: integer
          description: 0-based position among same-kind tracks in container order.
        language:
          type: string
          description: Raw container language tag.
        languageCode:
          type: string
          description: Normalised ISO 639-2 code.
        languageIndex:
          type: integer
          description: 0-based position among same-kind tracks of the same language.
        languageCount:
          type: integer
        codec:
          type: string
        profile:
          type: string
        title:
          type: string
        forced:
          type: boolean
        default:
          type: boolean
        bitmap:
          type: boolean
          description: Image-based subtitle (PGS/VobSub).

    TrackSelection:
      type: object
      required: [subtitleMode]
      description: |
        Server audio/subtitle choice from the effective profile, client and
        title preferences. Missing `audio`: keep the player default. Use
        `subtitle` when the renderer draws bitmap subtitles, else
        `textSubtitle`. Missing `subtitle` with `subtitleMode` other than
        `off` means no embedded track matched: search online in
        `subtitleLanguage`.
      properties:
        audio:
          $ref: '#/components/schemas/Track'
        subtitle:
          $ref: '#/components/schemas/Track'
        textSubtitle:
          $ref: '#/components/schemas/Track'
        audioLanguage:
          type: string
        subtitleLanguage:
          type: string
        subtitleMode:
          type: string
          enum: ['off', forced-only, 'on']

    PrequeueStatusResponse:
      type: object
      required: [prequeueId, status]
      properties:
        mediaEvidence:
          $ref: '#/components/schemas/MediaEvidence'
        automaticLibrarySelection:
          type: boolean
          description: True only for preparations created with automatic library selection.
        libraryItemId:
          type: string
          description: Stable library version identifier when a validated library candidate wins.
        librarySourceType:
          type: string
          enum: [local, plex, jellyfin]
        prequeueId:
          type: string
        status:
          $ref: '#/components/schemas/PrequeueStatus'
        userId:
          type: string
        targetEpisode:
          $ref: '#/components/schemas/EpisodeReference'
        progressStage:
          type: string
        progressDetail:
          type: string
        progressCurrent:
          type: integer
        progressCurrentMin:
          type: integer
        progressCurrentMax:
          type: integer
        progressTotal:
          type: integer
        streamPath:
          type: string
          description: Pass as `path` to `/api/video/stream`.
        displayName:
          type: string
        serviceType:
          type: string
        debridProvider:
          type: string
        fileSize:
          type: integer
          format: int64
          description: Bytes.
        healthStatus:
          type: string
        hasDolbyVision:
          type: boolean
        hasHdr10:
          type: boolean
        dolbyVisionProfile:
          type: string
        dolbyVisionConfiguration:
          $ref: '#/components/schemas/DolbyVisionConfiguration'
        needsAudioTranscode:
          type: boolean
        hlsSessionId:
          type: string
        hlsPlaylistUrl:
          type: string
        duration:
          type: number
          description: Seconds.
        frameRate:
          type: string
        selectedAudioTrack:
          type: integer
          deprecated: true
          description: Container stream index (not a list position); -1 = player default. Prefer `trackSelection.audio`.
        selectedSubtitleTrack:
          type: integer
          deprecated: true
          description: Container stream index (not a list position); -1 = none. Prefer `trackSelection.subtitle`.
        trackSelection:
          $ref: '#/components/schemas/TrackSelection'
        audioTracks:
          type: array
          items:
            $ref: '#/components/schemas/AudioTrackInfo'
        subtitleTracks:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrackInfo'
        subtitleSessions:
          type: object
          description: Keyed by subtitle stream index.
          additionalProperties:
            $ref: '#/components/schemas/SubtitleSessionInfo'
        passthroughName:
          type: string
        passthroughDescription:
          type: string
        resultAttributes:
          type: object
          additionalProperties:
            type: string
        selectedResult:
          $ref: '#/components/schemas/IndexerResult'
        selectedResultIndex:
          type: integer
        migrationCandidates:
          type: array
          description: Stream migration candidates (deferred for native clients).
          items:
            $ref: '#/components/schemas/IndexerResult'
        error:
          type: string

    ResolveRequest:
      type: object
      required: [result]
      properties:
        result:
          $ref: '#/components/schemas/IndexerResult'
        startOffset:
          type: number
          description: Seconds.
        profileId:
          type: string
        allowMarkedBad:
          type: boolean
        includeTrackSelection:
          type: boolean
        titleId:
          type: string
          description: Per-title language preference key.
        clientId:
          type: string
          description: Falls back to `X-Client-ID`.

    PlaybackResolution:
      type: object
      required: [queueId, webdavPath, healthStatus]
      properties:
        qualityAttributes:
          type: object
          description: Observed selected-file resolution and dimensions. advertisedResolution retains the original claim when supplied; release names remain unchanged.
          additionalProperties:
            type: string
        queueId:
          type: integer
          format: int64
        webdavPath:
          type: string
          description: Pass as `path` to `/api/video/stream`.
        healthStatus:
          type: string
        debridProvider:
          type: string
        fileSize:
          type: integer
          format: int64
        sourceNzbPath:
          type: string
        subtitleSessions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SubtitleSessionInfo'
        trackSelection:
          $ref: '#/components/schemas/TrackSelection'

    Chapter:
      type: object
      required: [title, start]
      properties:
        title:
          type: string
          description: Chapter name as reported by the player (truncated to 200 characters).
        start:
          type: number
          description: Seconds.
        end:
          type: number
          description: Seconds; optional (falls back to the next chapter's start, then the duration).

    SkipSegmentsRequest:
      type: object
      properties:
        imdbId:
          type: string
        season:
          type: integer
        episode:
          type: integer
        duration:
          type: number
          description: Media duration in seconds.
        chapters:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Chapter'

    Segment:
      type: object
      required: [type, start, end, source]
      properties:
        type:
          type: string
          enum: [intro, recap, outro, preview]
          description: '`outro` is the end-credits range (also movie credits); `preview` comes only from SkipDB.'
        start:
          type: number
          description: Seconds from the start of the media.
        end:
          type: number
          description: Seconds from the start of the media.
        source:
          type: string
          enum: [introdb, skipdb, chapter-explicit, chapter-heuristic]

    SkipSegmentsResponse:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'

    # ---------------------------------------------------------------- clients

    ClientRegistrationRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Stable device ID (same value as `X-Client-ID`).
        userId:
          type: string
          description: Active profile ID.
        deviceName:
          type: string
        nickname:
          type: string
        deviceType:
          type: string
          description: For example `Apple TV`, `Android TV`.
        os:
          type: string
          description: For example `tvOS`, `Android`.
        appVersion:
          type: string

    Client:
      type: object
      required: [id, userId]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        nickname:
          type: string
        deviceName:
          type: string
        deviceType:
          type: string
        os:
          type: string
        appVersion:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        firstSeenAt:
          type: string
          format: date-time
        filterEnabled:
          type: boolean

    ExplicitHealthRequest:
      type: object
      description: Scoped snapshotId/sourceIndex replaces result with the immutable server row and rechecks current context before and after existing explicit work. Client evidence is never attached to a row. Legacy unscoped requests are unchanged.
      required: [result]
      properties:
        result:
          type: object
          additionalProperties: true
          description: Existing NZBResult input. Any caller-supplied evidence fields are ignored and never trusted.
        profileId: {type: string}
        snapshotId: {type: string, minLength: 1, maxLength: 1024}
        sourceIndex: {type: integer, minimum: 0, maximum: 511}
        probeForTracks: {type: boolean}
        quickOnly: {type: boolean}
        verifyUncached: {type: boolean}

    ExplicitHealthResponse:
      type: object
      required: [status, healthy]
      properties:
        status: {type: string}
        healthy: {type: boolean}
        cached: {type: boolean}
        provider: {type: string}
        infoHash: {type: string}
        checkedSegments: {type: integer}
        totalSegments: {type: integer}
        missingSegments:
          type: array
          items: {type: string}
        fileName: {type: string}
        sampled: {type: boolean}
        tracksProbed: {type: boolean}
        tracksLoading: {type: boolean}
        trackProbeError: {type: string}
        errorMessage: {type: string}
        audioTracks:
          type: array
          items: {$ref: '#/components/schemas/AudioTrackInfo'}
        subtitleTracks:
          type: array
          items: {$ref: '#/components/schemas/SubtitleTrackInfo'}
        mediaEvidence: {$ref: '#/components/schemas/MediaEvidence'}

    FavoriteStationId:
      type: string
      pattern: '^station:[0-9a-f]{24}$'
      description: Existing server-resolved station identity. Never inferred by clients or treated as source access.
    FavoriteStationIds:
      type: array
      maxItems: 10000
      uniqueItems: true
      items: {$ref: '#/components/schemas/FavoriteStationId'}
    StationFavoriteSnapshot:
      type: object
      additionalProperties: false
      required: [favoriteStationIds]
      properties:
        favoriteStationIds: {$ref: '#/components/schemas/FavoriteStationIds'}
    StationFavoritesChannelsRequest:
      type: object
      additionalProperties: true
      description: |
        Existing GET/POST /api/live/channels supports additive favoriteStationIds
        (GET repeated favoriteStationId). Absent/empty station IDs preserve legacy
        source-favorite behavior. Nonempty IDs include current allowed members
        before category/favorite pinning and source count caps, followed by
        filtering and paging. includeHidden defaults false; true bypasses only
        personal hidden-channel preferences, never provider or category access.
        The existing bounded catalogue fetch is used; no stream is opened.
      properties:
        profileId: {type: string}
        sourceId: {type: string}
        sourceIndex: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 500}
        filter: {type: string, maxLength: 512}
        categories: {type: array, maxItems: 2000, items: {type: string}}
        favoriteIds: {type: array, maxItems: 10000, items: {type: string}}
        favoriteStationIds: {$ref: '#/components/schemas/FavoriteStationIds'}
        favoritesOnly: {type: boolean}
        includeHidden: {type: boolean, default: false}
        groupByStation: {type: boolean}
    StationFavoritesChannelsResponse:
      type: object
      required: [channels, totalBeforeFilter, total, offset, limit, hasMore, availableCategories]
      properties:
        channels:
          type: array
          items:
            type: object
            required: [id, name, url, stationId, stationVariants]
            properties:
              id: {type: string}
              name: {type: string}
              url: {type: string}
              sourceId: {type: string}
              sourceName: {type: string}
              stationId: {$ref: '#/components/schemas/FavoriteStationId'}
              stationName: {type: string}
              stationVariants:
                type: integer
                minimum: 1
                description: Visible eligible members after filters and count caps, before response pagination.
        totalBeforeFilter: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 0}
        hasMore: {type: boolean}
        availableCategories: {type: array, items: {type: string}}
        sources:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}

    RecordingPublic:
      type: object
      required: [id, userId, type, status, channelId, channelName, title, sourceUrl, startAt, endAt]
      description: Public recording metadata. Provider URLs are blank and outputPath is only an informational basename; playback uses the owned recording ID. Private repository and backup locations remain separate.
      properties:
        id: {type: string}
        userId: {type: string}
        type: {type: string, enum: [epg, time_block]}
        status: {type: string, enum: [pending, starting, running, completed, failed, cancelled]}
        channelId: {type: string}
        channelName: {type: string}
        title: {type: string}
        sourceUrl: {type: string, enum: ['']}
        outputPath: {type: string, pattern: '^[^/\\]*$'}
        outputSizeBytes: {type: integer, minimum: 0, description: Size of the first playable file only; never the summed size of separate parts.}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        capture: {$ref: '#/components/schemas/RecordingCapture'}
    RecordingCapture:
      type: object
      additionalProperties: false
      required: [version, phase, incomplete, sourceChanges, parts, gaps]
      description: Preserved input sections, not a continuous or content-verified programme. Multiple or interrupted parts remain incomplete. No concatenation, whole-capture timeline, source URL or filesystem location is exposed.
      properties:
        version: {type: integer, enum: [1]}
        phase: {type: string, enum: [capturing, waiting_capacity, finished, interrupted]}
        incomplete: {type: boolean}
        sourceChanges: {type: integer, minimum: 0, maximum: 256}
        parts: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/RecordingPart'}}
        gaps: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/RecordingGap'}}
    RecordingPart:
      type: object
      additionalProperties: false
      required: [index, startedAt, bytes]
      properties:
        index: {type: integer, minimum: 1, maximum: 256}
        sourceId: {type: string}
        channelId: {type: string}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        bytes: {type: integer, minimum: 0, description: Measured file-size snapshot. Until endedAt and endReason are present this is provisional and may be zero before measurement or media arrival.}
        endReason: {type: string, enum: [schedule, source_ended, capture_failed, cancelled, shutdown, restart]}
        streamPath: {type: string, pattern: '^recording:[A-Za-z0-9_-]+/parts/[1-9][0-9]{0,2}$', description: 'Present only for measured nonempty owned parts. Resolve by recording ID and canonical part index, never a caller file path.'}
    RecordingGap:
      type: object
      additionalProperties: false
      required: [startedAt, reason]
      description: Observed recorder transition bounds, not an exact analysis of missing broadcast frames or guaranteed continuous coverage.
      properties:
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        reason: {type: string, enum: [source_retry, capacity, access_changed]}

    OriginalLanguageEvidence:
      type: object
      required: [language, source, sourceTitleId, observedAt, expiresAt]
      description: Actual TMDB original-language metadata, never an available dub or spoken-content proof. Maximum lifetime 24 hours; cache copies never renew it. Missing, conflicting or expired provenance is unknown.
      properties:
        language: {type: string, minLength: 2, maxLength: 16}
        source: {type: string, enum: [tmdb]}
        sourceTitleId: {type: string, pattern: '^tmdb:(movie|series):[1-9][0-9]*$'}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}

    MediaEvidence:
      type: object
      required: [version, sourceVersion]
      description: |
        Read-only input/container metadata. Candidate claims and observed probe
        facts remain separate and never establish spoken language, decoded
        quality, correct content, device output or playback eligibility.
        No additional request, probe, poller or catalogue-filter completeness
        is implied. Facts belong to one exact release/file and, when verified,
        one official episode. Never combine properties across files/episodes.
        Missing title/episode binding means source-only, unconfirmed association.
        Movie bindings remain absent in this initial foundation.
      properties:
        version: {type: integer, enum: [1]}
        sourceVersion:
          type: string
          pattern: '^(candidate_v1_|file_v1_)[0-9a-f]{64}$'
          description: Domain-separated opaque release identity for candidate-only envelopes or concrete input-file/part identity for probed envelopes. This is not a content hash or a report-dialog version.
        candidateVersion:
          type: string
          pattern: '^candidate_v1_[0-9a-f]{64}$'
          description: Optional originating-release association. Never compare it with the probed file-version domain or merge envelopes by array index.
        titleId: {type: string}
        targetEpisode:
          $ref: '#/components/schemas/EpisodeReference'
        candidate:
          $ref: '#/components/schemas/MediaCandidateFacts'
        probed:
          $ref: '#/components/schemas/MediaProbeFacts'

    MediaHDRFact:
      type: string
      enum: [sdr, hdr10, hlg, dolby_vision]
      description: Omission means unknown. SDR requires a recognized actual transfer/colour signal in a probed block; a release label remains a candidate claim.

    MediaCandidateFacts:
      type: object
      required: [source, observedAt, expiresAt]
      description: Provider/release claims observed during normal search. Maximum lifetime 15 minutes with original timestamps. No track inventory, playable-source proof or audio-description inference.
      properties:
        source: {type: string, enum: [release_metadata]}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        audioLanguages:
          type: array
          maxItems: 16
          items: {type: string}
        subtitleLanguages:
          type: array
          maxItems: 16
          items: {type: string}
        resolution: {type: string}
        videoCodec: {type: string}
        audioCodecs:
          type: array
          maxItems: 16
          items: {type: string}
        hdr: {$ref: '#/components/schemas/MediaHDRFact'}

    MediaProbeFacts:
      type: object
      required: [source, observedAt, expiresAt, audioStreams, subtitleStreams, video]
      description: Actual ffprobe input-stream metadata, maximum lifetime 15 minutes. Path-only legacy caches cannot create this block. Primary languages use normalized ISO 639-3, without regional specificity. Complete flags default false and cannot prove absence from a clipped, missing or ambiguous inventory.
      properties:
        source: {type: string, enum: [ffprobe]}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        audioStreams:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/MediaAudioFacts'}
        audioStreamsComplete: {type: boolean, default: false}
        subtitleStreams:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/MediaSubtitleFacts'}
        subtitleStreamsComplete: {type: boolean, default: false}
        video: {$ref: '#/components/schemas/MediaVideoFacts'}

    MediaAudioFacts:
      type: object
      required: [index]
      properties:
        index: {type: integer, minimum: 0}
        language: {type: string}
        codec: {type: string, maxLength: 32}
        audioDescription:
          type: boolean
          description: Present only when the actual visual_impaired disposition field was present. Neither a missing field nor a title/name heuristic proves false or true.

    MediaSubtitleFacts:
      type: object
      required: [index]
      properties:
        index: {type: integer, minimum: 0}
        language: {type: string}
        codec: {type: string, maxLength: 32}
        forced: {type: boolean}

    MediaVideoFacts:
      type: object
      properties:
        codec: {type: string, maxLength: 32}
        width: {type: integer, minimum: 1, maximum: 32768}
        height: {type: integer, minimum: 1, maximum: 32768}
        hdr: {$ref: '#/components/schemas/MediaHDRFact'}
        dolbyVisionProfile: {type: string}

    ClientRegistrationResponse:
      type: object
      required: [client]
      properties:
        client:
          $ref: '#/components/schemas/Client'

    SourceFilterCriteria:
      type: object
      additionalProperties: false
      required: [basis, unknown]
      properties:
        basis: {type: string, enum: [candidate, probed]}
        unknown: {type: string, enum: [include, exclude]}
        audioLanguage: {type: string, pattern: '^[a-z]{3}$'}
        subtitleLanguage: {type: string, pattern: '^[a-z]{3}$'}
        claimedResolutionAtLeast: {type: string, pattern: '^[1-8][0-9]{2,3}p$'}
        heightAtLeast: {type: integer, minimum: 144, maximum: 8640}
        videoCodec: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
        dynamicRange: {$ref: '#/components/schemas/MediaHDRFact'}
        audioCodec: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
        audioDescription: {type: boolean, enum: [true]}
      oneOf:
        - properties:
            basis: {enum: [candidate]}
          not:
            anyOf:
              - required: [heightAtLeast]
              - required: [audioCodec]
              - required: [audioDescription]
        - properties:
            basis: {enum: [probed]}
          not:
            required: [claimedResolutionAtLeast]
      description: |
        Languages are canonical registered ISO 639-3 primary tags, never accent
        or original-language claims. Candidate language lists are incomplete;
        missing languages stay unknown. File audio predicates match one stream.
        Negative inventory conclusions require complete known inventories.

    SourceFilterTargetEpisode:
      type: object
      additionalProperties: false
      required: [episodeId, seasonNumber, episodeNumber]
      properties:
        episodeId: {type: string, minLength: 1, maxLength: 1024}
        seasonNumber: {type: integer, minimum: 0, maximum: 10000}
        episodeNumber: {type: integer, minimum: 1, maximum: 100000}
        numbering: {$ref: '#/components/schemas/EpisodeNumbering'}

    SourceFilterTarget:
      type: object
      additionalProperties: false
      required: [titleId, mediaType]
      properties:
        titleId: {type: string, minLength: 1, maxLength: 1024}
        mediaType: {type: string, enum: [movie, series]}
        episode: {$ref: '#/components/schemas/SourceFilterTargetEpisode'}
      description: Request correlation only. Unbound series file metadata is unknown for episode filtering.

    SourceFilterPageRequest:
      type: object
      additionalProperties: false
      required: [version, filters, limit]
      properties:
        version: {type: integer, enum: [1]}
        filters: {$ref: '#/components/schemas/SourceFilterCriteria'}
        cursor: {type: string, minLength: 1, maxLength: 1024}
        limit: {type: integer, minimum: 1, maximum: 100}

    SourceFilterRow:
      type: object
      additionalProperties: false
      required: [sourceIndex, candidateVersion, result, verdict]
      properties:
        sourceIndex: {type: integer, minimum: 0, maximum: 511}
        candidateVersion: {type: string, pattern: '^candidate_v1_[0-9a-f]{64}$'}
        result: {$ref: '#/components/schemas/IndexerResult'}
        verdict: {type: string, enum: [unfiltered, match, unknown]}
        mediaEvidence: {$ref: '#/components/schemas/MediaEvidence'}

    SourceFilterPage:
      type: object
      additionalProperties: false
      required: [sourceFiltersVersion, snapshotId, viewId, expiresAt, target, filters, rows, total, matchedTotal, unknownTotal, coverage]
      properties:
        sourceFiltersVersion: {type: integer, enum: [1]}
        snapshotId: {type: string, minLength: 1, maxLength: 1024}
        viewId: {type: string, minLength: 1, maxLength: 1024}
        expiresAt: {type: string, format: date-time}
        target: {$ref: '#/components/schemas/SourceFilterTarget'}
        filters: {$ref: '#/components/schemas/SourceFilterCriteria'}
        rows:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SourceFilterRow'}
        total: {type: integer, minimum: 0, maximum: 512}
        matchedTotal: {type: integer, minimum: 0, maximum: 512}
        unknownTotal: {type: integer, minimum: 0, maximum: 512}
        nextCursor: {type: string, minLength: 1, maxLength: 1024}
        sourceHealthToken: {type: string, maxLength: 1024}
        coverage:
          type: object
          additionalProperties: false
          required: [retainedCandidates, truncated]
          properties:
            retainedCandidates: {type: integer, minimum: 0, maximum: 512}
            truncated: {type: boolean}
